/* ---- 键盘快捷键（桌面端） ---- */
document.addEventListener('keydown',function(e){
  if(mode!=='practice'||!$('#s-quiz').classList.contains('on'))return;
  const tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  const d=list[idx];if(!d)return;
  if(d.opts&&d.opts.length&&!revealed){const n=parseInt(e.key,10);
    if(n>=1&&n<=d.opts.length){e.preventDefault();tapOpt(d.opts[n-1].k);return;}}
  if(e.key==='Enter'){e.preventDefault();
    if(!revealed){if(d.type==='multi')submitMulti();else if(d.type==='fill'||d.type==='qa')reveal();}
    else next();return;}
  if(e.key==='ArrowLeft'&&revealed)prev();
  if(e.key==='ArrowRight'&&revealed)next();
});
/* ---- 移动端滑动手势翻页 ---- */
let tX=0,tY=0;
document.addEventListener('touchstart',function(e){tX=e.touches[0].clientX;tY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  if(mode!=='practice'||!revealed)return;
  const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)next();else prev();}
},{passive:true});

function auMsg(t){var e=document.getElementById('auMsg');if(e)e.textContent=t;}
function friendlyErr(m){
  if(/Invalid login/i.test(m))return '邮箱或密码错误';
  if(/Email not confirmed/i.test(m))return '邮箱未验证，请查收邮件';
  if(/already registered|already been registered|User already/i.test(m))return '该邮箱已注册，请直接登录';
  if(/Password should be/i.test(m))return '密码至少 6 位';
  if(/Unable to validate|invalid/i.test(m))return '邮箱格式不正确';
  return m;
}
async function doLogin(){
  var mail=(document.getElementById('auMail').value||'').trim(),pwd=document.getElementById('auPwd').value||'';
  if(!mail||!pwd){auMsg('请填写邮箱和密码');return;}
  auMsg('登录中…');
  var r=await sb.auth.signInWithPassword({email:mail,password:pwd});
  if(r.error){auMsg(friendlyErr(r.error.message));return;}
  await afterAuth();
}
async function doSignup(){
  var nm=(document.getElementById('auName').value||'').trim();
  var mail=(document.getElementById('auMail').value||'').trim(),pwd=document.getElementById('auPwd').value||'';
  if(!mail||pwd.length<6){auMsg('请填写邮箱，密码至少 6 位');return;}
  auMsg('注册中…');
  var r=await sb.auth.signUp({email:mail,password:pwd,options:{data:{name:nm||mail.split('@')[0]}}});
  if(r.error){auMsg(friendlyErr(r.error.message));return;}
  if(r.data&&r.data.session){await afterAuth();}
  else auMsg('注册成功，请先到邮箱完成验证再登录');
}
async function afterAuth(){
  var u=await sb.auth.getUser();
  me=(u&&u.data&&u.data.user)?u.data.user:null;
  if(!me){go('home');return;}
  syncState='同步中…';renderAcct();
  await pullAll();renderAcct();go('home');
}
async function doLogout(){try{await sb.auth.signOut();}catch(e){}me=null;myProfile=null;isAdmin=false;syncState='';go('home');}
async function bootAuth(){
  if(!sb){renderAcct();return;}
  try{var s=await sb.auth.getSession();me=(s&&s.data&&s.data.session)?s.data.session.user:null;}catch(e){me=null;}
  if(me){syncState='同步中…';renderAcct();await pullAll();}
  renderAcct();
}

       '<td class="r">'+u.doneN+'</td><td class="r">'+(u.acc==null?'—':u.acc+'%')+'</td><td class="r">'+u.wrongN+'</td>'+
       '<td class="r">'+u.exN+'</td><td class="r">'+(u.avg==null?'—':u.avg)+'</td><td class="r">'+esc((u.upd||'').slice(5,16).replace('T',' '))+'</td></tr>';

function exportCsv(){
  if(!admCache)return;
  var rows=[['姓名','角色','已做题','正确率','错题数','模考次数','平均分','最近活跃']];
  admCache.forEach(function(u){rows.push([u.name,u.role==='admin'?'管理员':'学员',u.doneN,u.acc==null?'':u.acc+'%',u.wrongN,u.exN,u.avg==null?'':u.avg,u.upd||'']);});
  var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='学习情况统计.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}

/* 旧缓存自检：若页面内版本落后于服务器版本，提示用户刷新一次 */
(function(){
  var CUR='6.3';
  function tip(){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0A1F3A;color:#fff;padding:12px 14px;font-size:13px;text-align:center;line-height:1.5;box-shadow:0 -2px 12px rgba(0,0,0,.18)';
    d.innerHTML='\u68c0\u6d4b\u5230\u65b0\u7248\u672c\uff0c\u70b9\u51fb\u5237\u65b0\u5373\u53ef\u4f7f\u7528\u6700\u65b0\u9898\u5e93';
    d.onclick=function(){location.replace(location.pathname+'?v='+Date.now());};
    document.body.appendChild(d);
  }
  try{
    fetch(location.pathname+'?probe='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(h){
        var m=h.match(/\u7248\u672c v([0-9]+\.[0-9]+)/);
        if(m && m[1] && parseFloat(m[1])>parseFloat(CUR)) tip();
      })
      .catch(function(){});
  }catch(e){}
})();
