<style>
:root{--navy:#0A1F3A;--navy2:#123257;--gold:#D4AF37;--gold2:#F0D070;--bg:#F4F6FA;--card:#fff;--txt:#1b2733;--sub:#6b7a8d;--line:#e6ebf2;--ok:#1a9c5b;--bad:#d84a4a;--brand:#0A1F3A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top));padding-top:calc(14px + env(safe-area-inset-top))}
.hdr h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hdr h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 3px rgba(240,208,112,.25)}
.hdr .sub{font-size:12px;opacity:.75;margin-top:3px}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .3s}
.barlab{font-size:11px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
/* body */
.main{flex:1;padding:14px 14px 90px}
.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* home cards */
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat .box{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(10,31,58,.05)}
.stat .box b{display:block;font-size:20px;color:var(--navy);font-weight:800}
.stat .box span{font-size:11px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:16px;padding:18px 16px;box-shadow:0 2px 12px rgba(10,31,58,.06);cursor:pointer;transition:transform .15s;border:1px solid var(--line);position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:24px;margin-bottom:8px;display:block}
.tile b{display:block;font-size:16px;color:var(--navy);margin-bottom:3px}
.tile p{margin:0;font-size:12px;color:var(--sub)}
.tile .n{position:absolute;top:12px;right:14px;font-size:12px;color:var(--gold);font-weight:700}
/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* question card */
.qcard{background:var(--card);border-radius:16px;padding:18px 16px;box-shadow:0 2px 12px rgba(10,31,58,.06);border:1px solid var(--line)}
.qtag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:6px;background:#eef2f8;color:var(--sub);margin-bottom:10px;font-weight:600}
.qtag.judge{background:#eafaf1;color:#1a9c5b}.qtag.single{background:#eaf0ff;color:#3a63d6}.qtag.multi{background:#fff3e6;color:#c67a12}.qtag.fill{background:#f3ecff;color:#7a4bd6}.qtag.qa{background:#fbe9ec;color:#c0425f}
.qno{font-size:12px;color:var(--sub);float:right;margin-top:3px}
.qstem{font-size:16px;font-weight:600;color:var(--txt);margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.12s;background:#fff}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub)}
.opt .v{font-size:15px;padding-top:1px}
.opt.sel{border-color:var(--navy);background:#f4f7fc}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:#eefaf2}.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeeee}.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
/* fill & qa */
.fillin{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:10px;background:#fff;color:var(--txt)}
.reveal{background:#f7f9fc;border:1px dashed var(--line);border-radius:12px;padding:13px;font-size:14px;margin:6px 0}
.reveal b{color:var(--ok)}
.know{margin-top:8px;padding:10px 12px;border-radius:10px;background:#fdf7e6;border:1px solid #f0e0b0;font-size:13px;color:#8a6a1a}
.selfgrade{display:flex;gap:10px;margin-top:6px}
.selfgrade button{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.sg-ok{background:var(--ok)}.sg-no{background:var(--bad)}
/* listen / tts */
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--navy),var(--navy2));border:none}
.tile.wide b{color:#fff}.tile.wide p{color:rgba(255,255,255,.7)}
.player{display:flex;gap:10px;margin-top:12px}
.spk{flex:0 0 auto;margin-left:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer;vertical-align:middle}
/* nav buttons */
.navbtns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:13px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2c00}
.btn:disabled{opacity:.45}
/* browse list */
.browitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.browitem .ans{color:var(--ok);font-weight:600;margin-top:8px;font-size:14px}
/* exam result */
.res{text-align:center;padding:20px 0}
.res .ring{font-size:46px;font-weight:800;color:var(--navy)}
.res .ring small{font-size:18px;color:var(--sub)}
/* bottom tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tab{flex:1;padding:9px 0 7px;text-align:center;font-size:11px;color:var(--sub);cursor:pointer}
.tab .ti{font-size:19px;display:block;margin-bottom:1px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--navy);font-weight:700}.tab.on .ti{filter:none;opacity:1}
.back{font-size:14px;color:var(--sub);cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
.muted{color:var(--sub);font-size:13px;text-align:center;padding:20px}
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .e{font-size:40px;margin-bottom:8px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#fdeeee;color:var(--bad);margin-left:6px}
/* ===== v3 additions ===== */
.tres{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tres td{padding:5px 4px;border-top:1px solid var(--line);text-align:left}
.tres td:last-child{text-align:right;color:var(--navy);font-weight:700}
.spk.star{color:#b8c2cf;font-size:17px;margin-left:6px}
.spk.star.on{color:#d4a017;border-color:#e8d48a;background:#fffbe9}
.exhint{font-size:12px;color:var(--sub);margin:8px 0 6px}
.kbdhint{font-size:11px;color:var(--sub);text-align:center;margin-top:10px;display:none}
@media (min-width:700px){.kbdhint{display:block}}.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(10,31,58,.05)}
.acct.off{display:block;font-size:12px;color:var(--sub)}
.acct .who{min-width:0}
.acct .who b{display:block;font-size:15px;color:var(--navy);font-weight:700}
.acct .who span{font-size:11px;color:var(--sub)}
.acct .ops{display:flex;gap:6px;flex:0 0 auto}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;flex:0 0 auto;min-width:auto}
.role{font-size:11px;background:#eef2f8;color:var(--sub);padding:1px 7px;border-radius:8px;font-weight:600}
.role.admin{background:#fbe9ec;color:#c0425f}
.adm{width:100%;border-collapse:collapse;font-size:13px}
.adm th,.adm td{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.adm th{color:var(--sub);font-weight:600;font-size:12px}
.adm td.r{text-align:right;color:var(--navy);font-weight:600}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.foot{text-align:center;font-size:11px;color:#a3aebd;padding:14px 0 2px;line-height:1.6}
.foot .dotv{display:inline-block;width:5px;height:5px;border-radius:50%;background:#c9d2dd;margin:0 6px;vertical-align:middle}

</style>

},{"k":"C","v":"各尽所能,按需分配"},{"k":"D","v":"批评与自我批评"}],"ans":"ABD"},{"id":88,"type":"multi","stem":"经过长期努力,中国特色社会主义进入了新时代,这是我国发展新的历史方位。这个新时代,（　）。","opts":[{"k":"A","v":"是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代"},{"k":"B","v":"是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代"},{"k":"C","v":"是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代"},{"k":"D","v":"是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代"},{"k":"E","v":"是我国日益走近世界舞台中央、不断为人类作出更大贡献的时代"}],"ans":"ABCDE"},{"id":89,"type":"multi","stem":"(多选)《党章》中规定,各级党委要集体领导与个人分工负责相结合,凡属重大问题都要按( )原则。","opts":[{"k":"A","v":"集体领导"},{"k":"B","v":"民主集中"},{"k":"C","v":"个别酝酿"},{"k":"D","v":"会议决定"}],"ans":"ABCD"},{"id":90,"type":"multi","stem":"按照党的组织原则,基层组织可以根据工作需要和党员人数,经上级党组织批准,分别设立（　）","opts":[{"k":"A","v":"党的基层委员会"},{"k":"B","v":"党小组"},{"k":"C","v":"总支部委员会"},{"k":"D","v":"支部委员会"}],"ans":"ACD"},{"id":91,"type":"multi","stem":"党的二十大审议通过了《中国共产党章程(修正案)》。下面关于党章说法正确的是（　）","opts":[{"k":"A","v":"预备党员的权利、义务同正式党员一样"},{"k":"B","v":"预备党员的预备期,从支部大会通过其为预备党员之日算起"},{"k":"C","v":"党员的党龄,从预备期满转为正式党员之日算起"},{"k":"D","v":"中国共产党党徽为镰刀和斧头组成的图案"}],"ans":"BC"},{"id":92,"type":"multi","stem":"马克思主义政党必须遵循的最重要和最高层次的“三大规律”是（　）。","opts":[{"k":"A","v":"共产党执政规律"},{"k":"B","v":"社会主义建设规律"},{"k":"C","v":"经济发展变化规律"},{"k":"D","v":"人类社会发展规律"}],"ans":"ABD"},{"id":93,"type":"judge","stem":"近代以来中华民族最伟大的梦想是实现社会主义现代化。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":94,"type":"judge","stem":"随着我国社会主要矛盾的变化,我们对我国社会主义所处历史阶段的判断发生了变化,我国仍处于并将长期处于社会主义初级阶段的基本国情也发生了改变。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":95,"type":"judge","stem":"我国经济已由高速增长阶段转向中速发展阶段。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":96,"type":"judge","stem":"预备党员转正,或延长预备期,或取消预备党员资格,都应当经支部大会讨论通过和上级党组织批准。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"党章第七条：预备党员预备期满，党的支部应当及时讨论他能否转为正式党员。预备党员转正、延长预备期或取消预备党员资格，都应当经支部大会讨论通过和上级党组织批准。"},{"id":97,"type":"judge","stem":"新时代中国特色社会主义思想,明确中国特色社会主义事业总体布局是四位一体、战略布局是五个全面。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":98,"type":"judge","stem":"自觉遵守党的纪律,首先是党的政治纪律和政治规矩,模范遵守国家的法律法规,严格保守党和国家的秘密,执行党的决定,服从组织分配,积极完成党的任务。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A"},{"id":99,"type":"judge","stem":"党员根据实际情况,可以不编入党的一个支部、小组或者其他特定组织,参加党组织活动。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":100,"type":"judge","stem":"上级党组织在批准申请人入党以前,要派人同他谈话,作进一步的了解,并帮助他提高对党的认识。（　）","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A"},{"id":101,"type":"qa","stem":"中国共产党的入党誓词是什么？","opts":[],"ans":"我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。","know":"80字誓词，结尾两句是灵魂：随时牺牲一切、永不叛党。"},{"id":102,"type":"qa","stem":"\"十五五\"时期经济社会发展的主要目标？","opts":[],"ans":"（一）高质量发展取得显著成效。（二）科技自立自强水平大幅提高。（三）进一步全面深化改革取得新突破。（四）社会文明程度明显提升。（五）人民生活品质不断提高。（六）美丽中国建设取得新的重大进展。（七）国家安全屏障更加巩固。","know":"七个方面：高质/科技/改革/文明/民生/美丽中国/安全。"},{"id":103,"type":"qa","stem":"中共党员必须履行哪些义务？","opts":[],"ans":"（一）认真学习马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观、习近平新时代中国特色社会主义思想，学习党的路线、方针、政策和决议，学习党的基本知识和党的历史，学习科学、文化、法律和业务知识，努力提高为人民服务的本领。（二）增强\"四个意识\"、坚定\"四个自信\"、做到\"两个维护\"，贯彻执行党的基本路线和各项方针、政策，带头参加改革开放和社会主义现代化建设，带动群众为经济发展和社会进步艰苦奋斗，在生产、工作、学习和社会生活中起先锋模范作用。（三）坚持党和人民的利益高于一切，个人利益服从党和人民的利益，吃苦在前，享受在后，克己奉公，多做贡献。（四）自觉遵守党的纪律，首先是党的政治纪律和政治规矩，模范遵守国家的法律法规，严格保守党和国家的秘密，执行党的决定，服从组织分配，积极完成党的任务。（五）维护党的团结和统一，对党忠诚老实，言行一致，坚决反对一切派别组织和小集团活动，反对阳奉阴违的两面派行为和一切阴谋诡计。（六）切实开展批评和自我批评，勇于揭露和纠正违反党的原则的言行和工作中的缺点、错误，坚决同消极腐败现象作斗争。（七）密切联系群众，向群众宣传党的主张，遇事同群众商量，及时向党反映群众的意见和要求，维护群众的正当利益。（八）发扬社会主义新风尚，带头实践社会主义核心价值观和社会主义荣辱观，提倡共产主义道德，弘扬中华民族传统美德，为了保护国家和人民的利益，在一切困难和危险的时刻挺身而出，英勇斗争，不怕牺牲。","know":"党章八项义务：学习/先锋/奉献/守纪/团结/批评/联系群众/新风尚。首条学习，末条牺牲精神。"},{"id":104,"type":"qa","stem":"党的纪律主要包括哪几项？","opts":[],"ans":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。","know":"六大纪律：政组廉群工生。"},{"id":105,"type":"qa","stem":"请简述中国共产党在社会主义初级阶段的基本路线。","opts":[],"ans":"领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明、和谐、美丽的社会主义现代化强国而奋斗。","know":"一个中心两个基本点：经济建设为中心+四项基本原则+改革开放。"},{"id":106,"type":"judge","stem":"中国特色社会主义是改革开放以来党的全部理论和实践的主题。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A"},{"id":108,"type":"judge","stem":"确保到党的二十大召开时，我国现行标准下农村贫困人口实现脱贫，贫困县全部摘帽，解决区域性整体贫困，做到脱真贫、真脱贫。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":109,"type":"judge","stem":"信仰是一个国家、一个民族的灵魂。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":110,"type":"judge","stem":"人民当家作主是党领导人民治理国家的基本方式。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":111,"type":"judge","stem":"党组织讨论决定问题，必须执行少数服从多数的原则。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A"},{"id":112,"type":"judge","stem":"民主集中制是民主基础上的集中和集中指导下的民主相结合，它既是党的根本组织原则，也是群众路线在党的生活中的运用。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"《中国共产党章程》总纲原文。记忆：民主集中制＝「民主基础上的集中＋集中指导下的民主」相结合，既是党的根本组织原则，又是群众路线在党的生活中的运用。原题表述「民主集中制和党的根本组织原则」不合党章原文，已按党章订正。"},{"id":113,"type":"judge","stem":"坚持正确选人用人导向，是权力正确运行的根本保证，是加强和规范党内政治生活的重要举措。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B"},{"id":114,"type":"qa","stem":"新时代党的建设总要求是什么？","opts":[],"ans":"坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。","know":"主线：长期执政能力+先进性纯洁性；统领：政治建设；5+1+1：政治/思想/组织/作风/纪律+制度贯穿+反腐。"},{"id":115,"type":"qa","stem":"党员廉洁自律规范的具体内容是什么？","opts":[],"ans":"第一条 坚持公私分明，先公后私，克己奉公。第二条 坚持崇廉拒腐，清白做人，干净做事。第三条 坚持尚俭戒奢，艰苦朴素，勤俭节约。第四条 坚持吃苦在前，享受在后，甘于奉献。","know":"四句：公私分明/崇廉拒腐/尚俭戒奢/吃苦在前。"},{"id":116,"type":"qa","stem":"结合自身实际，谈一谈如何在日常工作生活中发挥党员先锋模范作用？","opts":[],"ans":"（开放题·参考要点）①坚定理想信念，带头学习党的创新理论；②立足本职岗位，勤奋工作、勇于担当、争创一流业绩；③践行全心全意为人民服务宗旨，密切联系群众、热心服务群众；④自觉遵守党纪国法和各项规章制度，廉洁自律；⑤做到吃苦在前、享受在后，关键时刻挺身而出，在日常工作、学习、生活各方面当先锋、作表率。","know":"学习/岗位/为民/守纪/奉献五维度，落脚\"平常时候看得出来、关键时刻站得出来\"。"},{"id":117,"type":"qa","stem":"结合自身谈谈你的入党动机？","opts":[],"ans":"（开放题·参考要点）正确的入党动机，是为实现共产主义和中华民族伟大复兴而奋斗、全心全意为人民服务，而不是为个人捞取好处。要树立马克思主义世界观、人生观、价值观，把个人理想追求融入党和人民的事业，在实践中不断端正入党动机，接受党组织的教育和考察，争取早日做一名合格的共产党员。","know":"核心一句话：为共产主义奋斗、为人民服务，而非个人私利。"},{"id":118,"type":"qa","stem":"结合党章的要求，联系自己的思想实际和工作实际，谈谈怎样以实际行动争取早日加入中国共产党？","opts":[],"ans":"（开放题·参考要点）①认真学习党章和党的理论，提高思想政治觉悟；②以党员标准严格要求自己，立足岗位建功立业、发挥模范作用；③主动汇报思想，自觉接受党组织的培养、教育和考察；④坚持批评与自我批评，改正缺点不足；⑤践行党的宗旨，服务群众、奉献社会，以实际行动争取按期转正、早日入党。","know":"学理论/严要求/受考察/改不足/真践行。"},{"id":119,"type":"qa","stem":"结合实际，谈谈如何认真学习党章、自觉遵守党章、切实贯彻党章、坚决维护党章。","opts":[],"ans":"（开放题·参考要点）①认真学习：原原本本、逐章逐条学党章，做到知敬畏、明规矩；②自觉遵守：把党章作为根本行为准则，用党章规范一言一行；③切实贯彻：立足本职贯彻落实党章各项规定和党的路线方针政策；④坚决维护：维护党章权威和严肃性，同一切违反党章的言行作斗争。","know":"学、守、贯、维四字递进：内化于心、外化于行、捍卫于责。"},{"id":120,"type":"single","stem":"习近平新时代中国特色社会主义思想，明确全面深化改革的总目标是（　）。","opts":[{"k":"A","v":"实现社会主义现代化和中华民族伟大复兴"},{"k":"B","v":"建设中国特色社会主义法治体系，建设社会主义法治国家"},{"k":"C","v":"把我国建成富强民主文明和谐美丽的社会主义现代化强国"},{"k":"D","v":"完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化"}],"ans":"D","know":"改革总目标=完善制度+治理现代化（选D）。易混：A是总任务，B是依法治国总目标，C是本世纪中叶奋斗目标。"},{"id":121,"type":"single","stem":"根据《中国共产党党员教育管理工作条例》,（ ）应当建立党员教育管理工作协调机构。","opts":[{"k":"A","v":"国务院"},{"k":"B","v":"省、自治区、直辖市党委"},{"k":"C","v":"市委"},{"k":"D","v":"县委"}],"ans":"B","src":"党教条例"},{"id":122,"type":"single","stem":"在党中央领导下，由（ ）牵头，建立全国党员教育管理工作协调小组，负责全国党员教育管理工作的规划部署、组织协调和检查指导。","opts":[{"k":"A","v":"中央纪委"},{"k":"B","v":"中央组织部"},{"k":"C","v":"中央宣传部"},{"k":"D","v":"中央办公厅"}],"ans":"B","src":"党教条例"},{"id":123,"type":"single","stem":"党组织要组织党员读原著、学原文、悟原理，深入学习领会习近平新时代中国特色社会主义思想的核心要义、基本精神、实践要求，掌握贯穿其中的马克思主义立场观点方法，增强政治自觉、理论自信、（ ）。","opts":[{"k":"A","v":"情感融入"},{"k":"B","v":"情感认同"},{"k":"C","v":"思想认同"},{"k":"D","v":"思想融通"}],"ans":"A","src":"党教条例"},{"id":124,"type":"single","stem":"党员教育管理工作要坚持（ ）相结合，组织培训和个人自学相结合，采取集中轮训、党委（党组）理论学习中心组学习、理论宣讲、组织生活、在线学习培训等方式进行。","opts":[{"k":"A","v":"集中教育和分散教育"},{"k":"B","v":"集中教育和经常性教育"},{"k":"C","v":"定期教育与不定期教育"},{"k":"D","v":"常规教育与自选动作"}],"ans":"B","src":"党教条例"},{"id":125,"type":"single","stem":"党支部应当（ ）开展 1 次主题党日，贴近党员思想和工作实际，组织党员集中学习、过组织生活、进行民主议事和开展志愿服务等。","opts":[{"k":"A","v":"每周"},{"k":"B","v":"每月"},{"k":"C","v":"每季度"},{"k":"D","v":"每年"}],"ans":"B","src":"党教条例"},{"id":126,"type":"single","stem":"党支部（ ）至少召开 1 次组织生活会，也可以根据工作需要随时召开，一般以党员大会、党支部委员会会议或者党小组会形式进行。","opts":[{"k":"A","v":"每周"},{"k":"B","v":"每月"},{"k":"C","v":"每季度"},{"k":"D","v":"每年"}],"ans":"D","src":"党教条例"},{"id":127,"type":"single","stem":"停止党籍（ ）年后确实无法取得联系的，按照自行脱党予以除名。","opts":[{"k":"A","v":"1"},{"k":"B","v":"2"},{"k":"C","v":"3"},{"k":"D","v":"5"}],"ans":"B","src":"党教条例"},{"id":128,"type":"single","stem":"党支部一般每年开展1次民主评议党员。党支部召开党员大会，按照（ ）的程序，组织党员进行评议。","opts":[{"k":"A","v":"个人自评、党员互评、民主测评"},{"k":"B","v":"个人述职、党员互评、领导点评"},{"k":"C","v":"个人述职、党员互评、民主测评"},{"k":"D","v":"个人自评、党员互评、民主推荐"}],"ans":"A","src":"党教条例"},{"id":129,"type":"single","stem":"党员每年集中学习培训时间一般不少于（ ）学时。","opts":[{"k":"A","v":"32"},{"k":"B","v":"58"},{"k":"C","v":"100"},{"k":"D","v":"200"}],"ans":"A","src":"党教条例"},{"id":130,"type":"single","stem":"《中国共产党党员教育管理工作条例》指出，要实行党员教育讲师聘任制，（ ）以上党委从优秀党校教师、基层党组织书记、先进模范人物、党务工作者、专家学者、实用技术人才、离退休干部等人员中选聘党员教育讲师。","opts":[{"k":"A","v":"乡镇"},{"k":"B","v":"县级"},{"k":"C","v":"市级"},{"k":"D","v":"省级"}],"ans":"B","src":"党教条例"},{"id":131,"type":"single","stem":"（ ）党委、行业系统党组织可以根据党员思想状况和党的建设需要，适时开展专题学习教育。","opts":[{"k":"A","v":"省级"},{"k":"B","v":"市纪"},{"k":"C","v":"县区级"},{"k":"D","v":"乡镇级"}],"ans":"A","src":"党教条例"},{"id":132,"type":"single","stem":"对因私出国并在国外长期定居的党员，出国学习研究超过 5 年仍未返回的党员，一般予以（ ）党籍。","opts":[{"k":"A","v":"除名"},{"k":"B","v":"开除"},{"k":"C","v":"停止"},{"k":"D","v":"视具体情况而定"}],"ans":"C","src":"党教条例"},{"id":133,"type":"single","stem":"对没有人事档案的党员，应当由（ ）建立党员档案，由所在党委或者县级以上党委组织部门保存。","opts":[{"k":"A","v":"党总支"},{"k":"B","v":"党组织"},{"k":"C","v":"党支部"},{"k":"D","v":"具有审批预备党员权限的基层党委"}],"ans":"D","src":"党教条例"},{"id":134,"type":"single","stem":"党员组织关系是指党员对党的基层组织的（ ）关系。","opts":[{"k":"A","v":"归属"},{"k":"B","v":"从属"},{"k":"C","v":"隶属"},{"k":"D","v":"属地"}],"ans":"C","src":"党教条例"},{"id":135,"type":"single","stem":"经党支部党员大会通过、基层党委审批接收的预备党员，自（ ）起，即取得党籍。","opts":[{"k":"A","v":"接收之日"},{"k":"B","v":"通过之日"},{"k":"C","v":"审批之日"},{"k":"D","v":"转正之日"}],"ans":"B","src":"党教条例"},{"id":136,"type":"single","stem":"每个党员都（ ）编入党的一个支部、小组或者其他特定组织。","opts":[{"k":"A","v":"必须"},{"k":"B","v":"应当"},{"k":"C","v":"可以"},{"k":"D","v":"需要"}],"ans":"A","src":"党教条例"},{"id":137,"type":"single","stem":"具有审批预备党员权限的（ ），可以在全国范围直接相互转移和接收党员组织关系。","opts":[{"k":"A","v":"市委"},{"k":"B","v":"县委"},{"k":"C","v":"党支部"},{"k":"D","v":"基层党委"}],"ans":"D","src":"党教条例"},{"id":138,"type":"single","stem":"党组织接收党员组织关系时，如有必要，（ ）采取适当方式查核党员档案。","opts":[{"k":"A","v":"必须"},{"k":"B","v":"应当"},{"k":"C","v":"可以"},{"k":"D","v":"允许"}],"ans":"C","src":"党教条例"},{"id":139,"type":"single","stem":"对组织关系转出但尚未被接收的党员，负有管理责任的是（ ）。","opts":[{"k":"A","v":"原所在党组织"},{"k":"B","v":"接受单位党组织"},{"k":"C","v":"本人"},{"k":"D","v":"上级党组织"}],"ans":"A","src":"党教条例"},{"id":140,"type":"single","stem":"《中国共产党党员教育管理工作条例》自（ ）起施行。","opts":[{"k":"A","v":"2019 年1月1日"},{"k":"B","v":"2019 年6月5日"},{"k":"C","v":"2019 年7月1日"},{"k":"D","v":"2019 年5月6日"}],"ans":"D","src":"党教条例"},{"id":141,"type":"multi","stem":"党员教育管理工作以马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想为指导，坚持（ ）相结合。","opts":[{"k":"A","v":"教育"},{"k":"B","v":"监督"},{"k":"C","v":"管理"},{"k":"D","v":"服务"}],"ans":"ABCD","src":"党教条例"},{"id":142,"type":"multi","stem":"党员教育管理工作遵循以下原则（ ）。","opts":[{"k":"A","v":"坚持党要管党、全面从严治党，将严的要求落实到党员教育管理工作全过程和各方面，党员领导干部带头接受教育管理"},{"k":"B","v":"坚持以党的政治建设为统领，突出党性教育和政治理论教育，引导党员遵守党章党规党纪，不忘初心、牢记使命"},{"k":"C","v":"坚持围绕中心、服务大局，注重党员教育管理质量和实效，保证党的理论和路线方针政策、党中央决策部署贯彻落实"},{"k":"D","v":"坚持从实际出发，加强分类指导，尊重党员主体地位，充分发挥党支部直接教育、管理、监督党员作用"}],"ans":"ABCD","src":"党教条例"},{"id":143,"type":"multi","stem":"《中国共产党党员教育管理工作条例》指出，要弘扬理论联系实际的马克思主义学风，引导党员（ ），学以致用、知行合一。","opts":[{"k":"A","v":"把自己摆进去"},{"k":"B","v":"把职责摆进去"},{"k":"C","v":"把工作摆进去"},{"k":"D","v":"把困难摆进去"}],"ans":"ABC","src":"党教条例"},{"id":144,"type":"multi","stem":"党员教育管理工作应坚持以党的政治建设为统领，突出（ ）教育，引导党员遵守党章党规党纪，不忘初心、牢记使命。","opts":[{"k":"A","v":"党性教育"},{"k":"B","v":"思想教育"},{"k":"C","v":"政治理论"},{"k":"D","v":"职业道德"}],"ans":"AC","src":"党教条例"},{"id":145,"type":"multi","stem":"党员教育管理工作应坚持（ ）相结合，采取集中轮训、党委（党组）理论学习中心组学习、理论宣讲、组织生活、在线学习培训等方式，形成习近平新时代中国特色社会主义思想学习教育长效机制，推动党员学深悟透、入脑入心。","opts":[{"k":"A","v":"集中教育" 体表现是国家富强、民族振兴、人民幸福，实现途径是走中国特色的社会主义道路、坚持中国特色社会主义理论体系、弘扬民族精神、凝聚中国力量，实施手段是政治、经济、文化、社会、生态文明五位一体建设","src":"培训班复习资料"},{"id":194,"type":"fill","stem":"一带一路：______。","opts":[],"ans":"一带一路是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称","know":"一带一路是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称。","src":"培训班复习资料"},{"id":195,"type":"fill","stem":"党的二十大报告提出的“七种思维”能力：______。","opts":[],"ans":"战略思维、历史思维、辩证思维、系统思维、创新思维、法治思维、底线思维","know":"二十大报告原文：要提高战略思维、历史思维、辩证思维、系统思维、创新思维、法治思维、底线思维能力。旧材料常写「五大思维」（只列战略、创新、辩证、法治、底线），遗漏历史思维、系统思维，属过时提法，按二十大报告订正为七种。","src":"培训班复习资料"},{"id":196,"type":"qa","stem":"请简述「供给侧结构性改革」。","opts":[],"ans":"就是从提高供给质量出发，用改革的办法推进结构调整，矫正要素配置扭曲，扩大有效供给，提高供给结构对需求变化的适应性和灵活性，提高全要素生产率，更好满足广大人民群众的需要，促进经济社会持续健康发展。供给侧结构性改革的根本目的是提高社会生产力水平，落实好以人民为中心的发展思想","src":"培训班复习资料"},{"id":197,"type":"fill","stem":"四大考验：______。","opts":[],"ans":"执政考验、改革开放考验、市场经济考验、外部环境考验","know":"执政考验、改革开放考验、市场经济考验、外部环境考验。","src":"培训班复习资料"},{"id":198,"type":"qa","stem":"请简述「八项规定」。","opts":[],"ans":"是中共中央政治局关于改进工作作风密切联系群众的规定，强调要改进调查研究、精简会议活动、精简文件简报、规范出访活动、改进警卫工作、改进新闻报道、严格文稿发表、厉行勤俭节约","src":"培训班复习资料"},{"id":199,"type":"fill","stem":"四风：______。","opts":[],"ans":"形式主义、官僚主义、享乐主义和奢靡之风","know":"形式主义、官僚主义、享乐主义和奢靡之风。","src":"培训班复习资料"},{"id":200,"type":"fill","stem":"三严三实：______。","opts":[],"ans":"既严以修身、严以用权、严以律己，又谋事要实、创业要实、做人要实","know":"既严以修身、严以用权、严以律己，又谋事要实、创业要实、做人要实。","src":"培训班复习资料"},{"id":201,"type":"qa","stem":"请简述「党的民主集中制“四个服从”」。","opts":[],"ans":"党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会","src":"培训班复习资料"},{"id":202,"type":"fill","stem":"党风廉政建设“两个责任”：______。","opts":[],"ans":"党委主体责任和纪委监督责任","know":"党委主体责任和纪委监督责任。","src":"培训班复习资料"},{"id":203,"type":"fill","stem":"党的“四条路线”：______。","opts":[],"ans":"政治路线、思想路线、组织路线、群众路线","know":"政治路线、思想路线、组织路线、群众路线。","src":"培训班复习资料"},{"id":204,"type":"fill","stem":"“四个自我”：______。","opts":[],"ans":"自我净化、自我完善、自我革新、自我提高能力","know":"自我净化、自我完善、自我革新、自我提高能力。","src":"培训班复习资料"},{"id":205,"type":"qa","stem":"请简述「监督执纪\"四种形态\"」。","opts":[],"ans":"党内监督必须把纪律挺在前面，运用监督执纪“四种形态”，经常开展批评和自我批评、约谈函询，让“红红脸、出出汗”成为常态；党纪轻处分、组织调整成为违纪处理的大多数；党纪重处分、重大职务调整的成为少数；严重违纪涉嫌违法立案审查的成为极少数","src":"培训班复习资料"},{"id":206,"type":"qa","stem":"请简述「党风廉政建设“一岗双责”」。","opts":[],"ans":"各级干部在履行本职岗位管理职责的同时，还要对所在单位和分管工作领域的党风廉政建设负责。通俗地说，就是“一个岗位，两种责任”，每位干部既要干事，还不能出事，一手抓发展，一手抓廉政，“两手抓、两手都要硬”","src":"培训班复习资料"},{"id":207,"type":"qa","stem":"请简述「一案双查」。","opts":[],"ans":"在查办违纪违法案件的同时，一并调查发案单位党委主体责任、纪委监督责任是否落实到位，做到有错必究、有责必问","src":"培训班复习资料"},{"id":208,"type":"fill","stem":"两学一做：______。","opts":[],"ans":"学党章党规、学系列讲话，做合格党员","know":"学党章党规、学系列讲话，做合格党员","src":"培训班复习资料"},{"id":209,"type":"fill","stem":"四讲四有：______。","opts":[],"ans":"讲政治、有信念，讲规矩、有纪律，讲道德、有品行，讲奉献、有作为","know":"讲政治、有信念，讲规矩、有纪律，讲道德、有品行，讲奉献、有作为。","src":"培训班复习资料"},{"id":210,"type":"fill","stem":"好干部“五条标准”：______。","opts":[],"ans":"信念坚定、为民服务、勤政务实、敢于担当、清正廉洁","know":"信念坚定、为民服务、勤政务实、敢于担当、清正廉洁。","src":"培训班复习资料"},{"id":211,"type":"fill","stem":"心中“四有”：______。","opts":[],"ans":"心中有党、心中有民、心中有责、心中有戒","know":"心中有党、心中有民、心中有责、心中有戒。","src":"培训班复习资料"},{"id":212,"type":"fill","stem":"“三个维护”：______。","opts":[],"ans":"维护党中央权威、维护核心、维护和贯彻军委主席负责制","know":"维护党中央权威、维护核心、维护和贯彻军委主席负责制。","src":"培训班复习资料"},{"id":213,"type":"fill","stem":"“三会一课”：______。","opts":[],"ans":"“三会”是：定期召开支部党员大会、支部委员会、党小组会；“一课”是：按时上好党课","know":"“三会”是：定期召开支部党员大会、支部委员会、党小组会；“一课”是：按时上好党课。","src":"培训班复习资料"},{"id":214,"type":"fill","stem":"党支部七项组织生活制度：______。","opts":[],"ans":"会议制度、党日制度、党课制度、报告制度、民主生活制度、党员汇报制度、民主评议党员制度","know":"会议制度、党日制度、党课制度、报告制度、民主生活制度、党员汇报制度、民主评议党员制度。","src":"培训班复习资料"},{"id":215,"type":"fill","stem":"党的三大作风：______。","opts":[],"ans":"理论联系实际、密切联系群众、批评和自我批评","know":"理论联系实际、密切联系群众、批评和自我批评。","src":"培训班复习资料"},{"id":216,"type":"fill","stem":"“三型”政党：______。","opts":[],"ans":"学习型、服务型、创新型","know":"学习型、服务型、创新型。","src":"培训班复习资料"},{"id":217,"type":"fill","stem":"党的二十大召开时间：______。","opts":[],"ans":"2022年10月16日至10月22日","know":"2022年10月16日至10月22日。","src":"培训班复习资料"},{"id":218,"type":"fill","stem":"党的思想路线：______。","opts":[],"ans":"解放思想，实事求是，与时俱进和求真务实","know":"解放思想，实事求是，与时俱进和求真务实。","src":"培训班复习资料"},{"id":219,"type":"qa","stem":"请简述「社会主义核心价值观」。","opts":[],"ans":"富强、民主、文明、和谐（是国家层面的价值目标）；自由、平等、公正、法治（是社会层面的价值取向）；爱国、敬业、诚信、友善（是公民个人层面的价值准则）","src":"培训班复习资料"},{"id":220,"type":"fill","stem":"“一府两院”：______。","opts":[],"ans":"“一府”是指人民政府，“两院”是指人民法院、人民检察院","know":"“一府”是指人民政府，“两院”是指人民法院、人民检察院。","src":"培训班复习资料"},{"id":221,"type":"qa","stem":"请简述「“一国两制”」。","opts":[],"ans":"即“一个国家，两种制度”，是中国政府为实现国家和平统一而提出的基本国策。按照邓小平的论述，“一国两制”是指在一个中国的前提下，国家的主体坚持社会主义制度，香港、澳门、台湾保持原有的资本主义制度长期不变","src":"培训班复习资料"},{"id":222,"type":"fill","stem":"双创：______。","opts":[],"ans":"指大众创业、万众创新","know":"指大众创业、万众创新。","src":"培训班复习资料"},{"id":223,"type":"fill","stem":"“两个同步”：______。","opts":[],"ans":"一个就是城乡居民收入水平要和经济增长同步，另一个就是劳动者报酬要和生产率提高同步","know":"一个就是城乡居民收入水平要和经济增长同步，另一个就是劳动者报酬要和生产率提高同步。","src":"培训班复习资料"},{"id":224,"type":"fill","stem":"两免一补：______。","opts":[],"ans":"指免杂费、免书本费、补助寄宿生生活费","know":"指免杂费、免书本费、补助寄宿生生活费。","src":"培训班复习资料"},{"id":225,"type":"fill","stem":"三权分置：______。","opts":[],"ans":"指形成所有权、承包权、经营权三权分置、经营权流转的格局","know":"指形成所有权、承包权、经营权三权分置、经营权流转的格局。","src":"培训班复习资料"},{"id":226,"type":"fill","stem":"三医：______。","opts":[],"ans":"指医疗、医保、医药","know":"指医疗、医保、医药。","src":"培训班复习资料"},{"id":227,"type":"fill","stem":"三公消费：______。","opts":[],"ans":"指政府部门人员因公出国（境）经费、公务车购置及运行费、公务招待费产生的消费","know":"指政府部门人员因公出国（境）经费、公务车购置及运行费、公务招待费产生的消费。","src":"培训班复习资料"},{"id":228,"type":"fill","stem":"四大板块：______。","opts":[],"ans":"指要大力建设西部地区、东北地区、东部地区和中部地区","know":"指要大力建设西部地区、东北地区、东部地区和中部地区。","src":"培训班复习资料"},{"id":229,"type":"qa","stem":"请简述「放管服」。","opts":[],"ans":"指简政放权、放管结合、优化服务的简称。“放”即简政放权，降低准入门槛”。 “管”即公正监管，促进公平竞争”。 “服”即高效服务，营造便利环境","src":"培训班复习资料"},{"id":230,"type":"qa","stem":"请简述「全域旅游」。","opts":[],"ans":"指在一定区域内，以旅游业为优势产业，通过对区域内经济社会资源尤其是旅游资源、相关产业、生态环境、公共服务、体制机制、政策法规、文明素质等进行全方位、系统化的优化提升，实现区域资源有机整合、产业融合发展、社会共建共享，以旅游业带动和促进经济社会协调发展的一种新的区域协调发展理念和模式","src":"培训班复习资料"},{"id":231,"type":"qa","stem":"请简述「“三个代表”」。","opts":[],"ans":"中国共产党要始终代表中国先进生产力的发展要求，中国共产党要始终代表中国先进文化的前进方向，中国共产党要始终代表中国最广大人民的根本利益","src":"培训班复习资料"},{"id":232,"type":"qa","stem":"请简述「“万企帮万村”行动」。","opts":[],"ans":"“万企帮万村”行动主要以民营企业为帮扶方，以建档立卡的贫困村、贫困户为帮扶对象，以签约结对、村企共建为主要形式，力争用3到5年时间，动员全国1万家以上民营企业参与，帮助1万个以上贫困村加快脱贫进程，为促进非公有制经济健康发展和非公有制经济人士健康成长，打好扶贫攻坚战、全面建成小康社会贡献力量","src":"培训班复习资料"},{"id":233,"type":"fill","stem":"新媒体：______。","opts":[],"ans":"新媒体是指当下万物皆媒的环境，简单说：新媒体是一种环境。新媒体涵盖了所有数字化的媒体形式","know":"新媒体是指当下万物皆媒的环境，简单说：新媒体是一种环境。新媒体涵盖了所有数字化的媒体形式。","src":"培训班复习资料"},{"id":234,"type":"qa","stem":"请简述「智慧城市」。","opts":[],"ans":"智慧城市就是运用信息和通信技术手段感测、分析、整合城市运行核心系统的各项关键信息，从而对包括民生、环保、公共安全、城市服务、工商业活动在内的各种需求做出智能响应","src":"培训班复习资料"},{"id":235,"type":"fill","stem":"工匠精神：______。","opts":[],"ans":"指工匠对自己的产品精雕细琢，精益求精、更完美的精神理念","know":"指工匠对自己的产品精雕细琢，精益求精、更完美的精神理念。","src":"培训班复习资料"},{"id":236,"type":"qa","stem":"请简述「精准扶贫」。","opts":[],"ans":"精准扶贫是粗放扶贫的对称，是指针对不同贫困区域环境、不同贫困农户状况，运用科学有效程序对扶贫对象实施精确识别、精确帮扶、精确管理的治贫方式。一般来说，精准扶贫主要是就贫困居民而言的，谁贫困就扶持谁","src":"培训班复习资料"},{"id":237,"type":"fill","stem":"党的根本宗旨：______。","opts":[],"ans":"全心全意为人民服务","know":"全心全意为人民服务。","src":"培训班复习资料"},{"id":238,"type":"fill","stem":"预备党员的预备期：______。","opts":[],"ans":"预备党员的预备期为一年，从支部大会通过他为预备党员之日算起","know":"预备党员的预备期为一年，从支部大会通过他为预备党员之日算起。","src":"培训班复习资料"},{"id":239,"type":"qa","stem":"请简述「自行脱党」。","opts":[],"ans":"党员如果没有正当理由，连续六个月不参加党的组织生活，或不交纳党费，或不做党所分配的工作，就被认为是自行脱党。支部大会应当决定把这样的党员除名，并报上级党组织批准","src":"培训班复习资料"},{"id":240,"type":"fill","stem":"党龄：______。","opts":[],"ans":"指成为正式党员后的全部时间。党员的党龄，从预备期满转为正式党员之日算起","know":"指成为正式党员后的全部时间。党员的党龄，从预备期满转为正式党员之日算起。","src":"培训班复习资料"},{"id":241,"type":"single","stem":"党的二十届三中全会是在全面建设社会主义现代化国家新征程开局起步的关键时期召开的一次十分重要的会议，全会审议通过了哪一项重要决定？______","opts":[{"k":"A","v":"《中共中央关于推进法治国家建设的决定》"},{"k":"B","v":"《中共中央关于进一步全面深化改革、推进中国式现代化的决定》"},{"k":"C","v":"《中共中央关于深化党和国家机构改革的决定》"},{"k":"D","v":"《中共中央关于全面加强党的建设的决定》"}],"ans":"B","src":"培训班复习资料"},{"id":242,"type":"single","stem":"中国共产党和中国人民以英勇顽强的奋斗向世界庄严宣告，______是决定当代中国前途命运的关键一招。","opts":[{"k":"A","v":"党的领导"},{"k":"B","v":"改革开放"},{"k":"C","v":"科技创新"},{"k":"D","v":"科学发展"}],"ans":"B","src":"培训班复习资料"},{"id":243,"type":"single","stem":"依据《中国共产党纪律处分条例》规定，党员有嫖娼或者吸食、注射毒品等丧失党员条件，严重败坏党的形象行为的，应当给予______处分。","opts":[{"k":"A","v":"严重警告"},{"k":"B","v":"撤销党内职务"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"D","src":"培训班复习资料"},{"id":244,"type":"single","stem":"党章（修正案）经中国共产党第二十次全国代表大会部分修改后于______通过。","opts":[{"k":"A","v":"2022年11月22日"},{"k":"B","v":"2022年10月22日"},{"k":"C","v":"2022年10月24日"},{"k":"D","v":"2022年10月16日"}],"ans":"B","src":"培训班复习资料"},{"id":245,"type":"single","stem":"《党章》规定，党的基层组织要组织党员认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，推进“两学一做”学习教育、______常态化制度化。","opts":[{"k":"A","v":"科学发展观学习教育"},{"k":"B","v":"“不忘初心牢记使命”主题教育"},{"k":"C","v":"“三严三实”专题教育"},{"k":"D","v":"党史学习教育"}],"ans":"D","src":"培训班复习资料"},{"id":246,"type":"single","stem":"党的二十大报告指出，治国有常，利民为本。______是立党为公、执政为民的本质要求。","opts":[{"k":"A","v":"以人为本"},{"k":"B","v":"为民造福"},{"k":"C","v":"共同富裕"},{"k":"D","v":"保障人民健康"}],"ans":"B","src":"培训班复习资料"},{"id":247,"type":"single","stem":"对出国（境）学习研究党员，由原就读高校或者工作单位党组织保留其组织关系，______至少与其联系1次。","opts":[{"k":"A","v":"每月"},{"k":"B","v":"每季度"},{"k":"C","v":"每半年"},{"k":"D","v":"每年"}],"ans":"C","src":"培训班复习资料"},{"id":248,"type":"single","stem":"中国共产党党员的党龄，从______之日算起。","opts":[{"k":"A","v":"预备期满转为正式党员"},{"k":"B","v":"成为预备党员"},{"k":"C","v":"成为正式党员后一年"},{"k":"D","v":"递交申请书"}],"ans":"A","src":"培训班复习资料"},{"id":249,"type":"single","stem":"《党章》规定，党的基层委员会、总支部委员会、支部委员会每届任期______。","opts":[{"k":"A","v":"2年"},{"k":"B","v":"3年"},{"k":"C","v":"3年至5年"},{"k":"D","v":"5年"}],"ans":"C","src":"培训班复习资料"},{"id":250,"type":"single","stem":"五四运动孕育了五四精神，其核心内容是______。","opts":[{"k":"A","v":"爱国、进取、民主、科学"},{"k":"B","v":"爱国、敬业、诚信、友善"},{"k":"C","v":"爱国、进步、民主、科学"},{"k":"D","v":"自由、平等、公正、法治"}],"ans":"C","src":"培训班复习资料"},{"id":251,"type":"single","stem":"党章规定，非公有制经济组织中党的基层组织的主要职责不包括______。","opts":[{"k":"A","v":"指导生产、运输、销售等全链条工作"},{"k":"B","v":"领导工会、共青团等群团组织"},{"k":"C","v":"团结凝聚职工群众"},{"k":"D","v":"促进企业健康发展"}],"ans":"A","src":"培训班复习资料"},{"id":252,"type":"single","stem":"申请入党的人，要填写入党志愿书，要有______名正式党员作介绍人，要经过支部大会通过和上级党组织批准，并且经过预备期的考察，才能成为正式党员。","opts":[{"k":"A","v":"四"},{"k":"B","v":"三"},{"k":"C","v":"两"},{"k":"D","v":"一"}],"ans":"C","src":"培训班复习资料"},{"id":253,"type":"fill","stem":"中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，党的宗旨是______。","opts":[],"ans":"全心全意为人民服务","src":"培训班复习资料"},{"id":254,"type":"fill","stem":"新修订的《中国共产党纪律处分条例》于2023年12月19日发布，自______起施行。","opts":[],"ans":"2024年1月1日","src":"培训班复习资料·已校订"},{"id":255,"type":"fill","stem":"习近平新时代中国特色社会主义思想的主要内容包括“______个明确”“______个坚持”和“______个方面成就”。","opts":[],"ans":"十；十四；十三","src":"培训班复习资料·已校订"},{"id":256,"type":"fill","stem":"发展党员，必须把______放在首位，经过党的支部，坚持个别吸收的原则。","opts":[],"ans":"政治标准","src":"培训班复习资料"},{"id":257,"type":"fill","stem":"对党员的纪律处分有五种：（一）警告；（二）严重警告；（三）撤销党内职务；（四）______；（五）开除党籍。","opts":[],"ans":"留党察看","src":"培训班复习资料"},{"id":258,"type":"fill","stem":"在与新冠疫情的殊死较量中，中国人民和中华民族敢于斗争、敢于胜利的大无畏气概，铸就了生命至上、______、舍生忘死、尊重科学、命运与共的伟大抗疫精神。","opts":[],"ans":"举国同心","src":"培训班复习资料"},{"id":259,"type":"fill","stem":"“四个意识”是指：政治意识、大局意识、______、看齐意识。","opts":[],"ans":"核心意识","src":"培训班复习资料"},{"id":260,"type":"fill","stem":"党的十八大以来，中国特色社会主义进入______。党面临的主要任务是，实现第一个百年奋斗目标，开启实现第二个百年奋斗目标新征程，朝着实现______的宏伟目标继续前进。","opts":[],"ans":"新时代；中华民族伟大复兴","src":"培训班复习资料·已校订"},{"id":261,"type":"fill","stem":"依据《中国共产党纪律处分条例》规定，党员受到开除党籍处分，______内不得重新入党，也不得推荐担任与其原任职务相当或者高于其原任职务的党外职务。","opts":[],"ans":"5年","src":"培训班复习资料"},{"id":262,"type":"fill","stem":"党支部一般每年开展1次民主评议党员。党支部召开党员大会，按照个人自评、______、民主测评的程序，组织党员进行评议。","opts":[],"ans":"党员互评","src":"培训班复习资料"},{"id":263,"type":"fill","stem":"习近平总书记在党的二十大报告中指出，经过不懈努力，党找到了______这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。","opts":[],"ans":"自我革命","src":"培训班复习资料"},{"id":264,"type":"single","stem":"党的纪律处分工作应当坚持以下原则①坚持党要管党、全面从严治党。加强对党的各级组织和全体党员的教育、管理和监督，把纪律挺在前面，注重抓早抓小、防微杜渐。②党纪面前一律平等。对违犯党纪的党组织和党员必须严肃、公正执行纪律，党内不允许有任何不受纪律约束的党组织和党员。③实事求是。对党组织和党员违犯党纪的行为，应当以事实为依据，以党章、其他党内法规和国家法律法规为准绳，准确认定违纪性质，区别不同情况，恰当予以处理。④民主集中制。实施党纪处分，应当按照规定程序经党组织集体讨论决定，不允许任何个人或者少数人擅自决定和批准。上级党组织对违犯党纪的党组织和党员作出的处理决定，下级党组织必须执行。⑤惩前毖后、治病救人。处理违犯党纪的党组织和党员，应当实行惩戒与教育相结合，做到宽严相济。","opts":[{"k":"A","v":"①②③④"},{"k":"B","v":"①②③④⑤"},{"k":"C","v":"①②④⑤"},{"k":"D","v":"②③④⑤"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":265,"type":"single","stem":"党员受到警告处分______、受到严重警告处分______，不得在党内提拔职务和向党外组织推荐担任高于其原任职务的党外职务。","opts":[{"k":"A","v":"半年内  一年 内"},{"k":"B","v":"一年内  一年半内"},{"k":"C","v":"一年内  二年内"},{"k":"D","v":"半年内  两年内"}],"ans":"B","src":"培训班复习资料·党纪条例","know":"《中国共产党纪律处分条例》第十二条：党员受到警告处分一年内、受到严重警告处分一年半内，不得在党内提拔职务和向党外组织推荐担任高于其原任职务的党外职务。2023年修订版用语为「提拔职务」（2018年版为「提升职务」），已按现行条例订正。"},{"id":266,"type":"single","stem":"留党察看处分，分为留党察看______、留党察看______。","opts":[{"k":"A","v":"半年  一年"},{"k":"B","v":"二年  三年"},{"k":"C","v":"一年  二年"},{"k":"D","v":"一年内  三年"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":267,"type":"single","stem":"党员受留党察看处分期间，没有______。","opts":[{"k":"A","v":"表决权、选举权和被选举权"},{"k":"B","v":"选举权和被选举权"},{"k":"C","v":"表决权、选举权"},{"k":"D","v":"表决权、被选举权"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":268,"type":"single","stem":"党组织在纪律审查中发现党员有贪污贿赂、滥用职权、玩忽职守、权力寻租、利益输送、徇私舞弊、浪费国家资财等违反法律涉嫌犯罪行为的，______给予撤销党内职务、留党察看或者开除党籍处分。","opts":[{"k":"A","v":"可以"},{"k":"B","v":"必须"},{"k":"C","v":"应当"},{"k":"D","v":"建议"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":269,"type":"single","stem":"党组织在纪律审查中发现党员严重违纪涉嫌违法犯罪的，原则上先作出______决定，并按照规定给予政务处分后，再移送有关国家机关依法处理。","opts":[{"k":"A","v":"行政处罚"},{"k":"B","v":"政纪处分"},{"k":"C","v":"组织处理"},{"k":"D","v":"党纪处分"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":270,"type":"single","stem":"党员被依法______、逮捕的，党组织应当按照管理权限中止其表决权、选举权和被选举权等党员权利。","opts":[{"k":"A","v":"拘留"},{"k":"B","v":"留置"},{"k":"C","v":"传唤"},{"k":"D","v":"讯问"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":271,"type":"single","stem":"本条例所称主动交代，是指涉嫌违纪的党员在组织初核______向有关组织交代自己的问题，或者在初核和立案审查其问题______交代组织未掌握的问题。","opts":[{"k":"A","v":"前；期间"},{"k":"B","v":"期间；前"},{"k":"C","v":"后；期间"},{"k":"D","v":"期间；后"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":272,"type":"single","stem":"党纪处分决定作出后，应当在______向受处分党员所在党的基层组织中的全体党员及其本人宣布，是领导班子成员的还应当向所在党组织领导班子宣布，并按照干部管理权限和组织关系将处分决定材料归入受处分者档案。","opts":[{"k":"A","v":"一周内"},{"k":"B","v":"半个月内"},{"k":"C","v":"一个月内"},{"k":"D","v":"两个月内"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":273,"type":"single","stem":"在重大原则问题上不同党中央保持一致且有实际言论、行为或者造成不良后果的，给予______处分；情节较重的，给予______处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"警告；严重警告；撤销党内职务"},{"k":"B","v":"严重警告；撤销党内职务；留党察看"},{"k":"C","v":"严重警告或者撤销党内职务；留党察看；开除党籍"},{"k":"D","v":"警告或者严重警告；撤销党内职务或者留党察看；开除党籍"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":274,"type":"single","stem":"通过网络、广播、电视、报刊、传单、书籍等，或者利用讲座、论坛、报告会、座谈会等方式，公开发表坚持资产阶级自由化立场、反对四项基本原则，反对党的改革开放决策的文章、演说、宣言、声明等的，给予______处分。","opts":[{"k":"A","v":"警告"},{"k":"B","v":"严重警告"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":275,"type":"single","stem":"在党内组织秘密集团或者组织其他分裂党的活动的，给予______处分。","opts":[{"k":"A","v":"警告"},{"k":"B","v":"严重警告"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":276,"type":"single","stem":"党员领导干部在本人主政的地方或者分管的部门自行其是，搞山头主义，拒不执行党中央确定的大政方针，甚至背着党中央另搞一套的，给予______。","opts":[{"k":"A","v":"撤销党内职务、留党察看或开除党籍"},{"k":"B","v":"撤销党内职务、留党察看"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":277,"type":"single","stem":"落实党中央决策部署不坚决，打折扣、搞变通，在政治上造成不良影响或者严重后果的，给予警告或者严重警告处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"开除党籍"},{"k":"B","v":"留党察看"},{"k":"C","v":"撤销党内职务、留党察看或者开除党籍"},{"k":"D","v":"撤销党内职务、留党察看"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":278,"type":"single","stem":"对党不忠诚不老实，表里不一，阳奉阴违，欺上瞒下，搞两面派，做两面人，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"严重警告"},{"k":"B","v":"撤销党内职务"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":279,"type":"single","stem":"制造、散布、传播政治谣言，破坏党的团结统一的，给予警告或者严重警告处分；情节较重的，给予______处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"严重警告"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"开除党籍"},{"k":"D","v":"撤销党内职务或者留党察看"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":280,"type":"single","stem":"擅自对应当由党中央决定的重大政策问题作出决定、对外发表主张的，对直接责任者和领导责任者，给予严重警告或者撤销党内职务处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"撤销党内职务或者留党察看"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"留党察看或者开除党籍"},{"k":"D","v":"撤销党内职务或者开除党籍"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":281,"type":"single","stem":"不按照有关规定向组织请示、报告重大事项，情节较重的，给予警告或者严重警告处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"撤销党内职务或者留党察看"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"留党察看或者开除党籍"},{"k":"D","v":"撤销党内职务或者开除党籍"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":282,"type":"single","stem":"干扰巡视巡察工作或者不落实巡视巡察整改要求，情节较轻的，给予警告或者严重警告处分；情节较重的，给予______处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"严重警告或者留党察看"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"撤销党内职务或者留党察看"},{"k":"D","v":"留党察看或者开除党籍"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":283,"type":"single","stem":"对信仰宗教的党员，应当加强思想教育，经党组织帮助教育仍没有转变的，应当______；劝而不退的，予以______；参与利用宗教搞煽动活动的，给予开除党籍处分。","opts":[{"k":"A","v":"劝其退党 勒令退党"},{"k":"B","v":"劝其退党 除名"},{"k":"C","v":"勒令退党 除名"},{"k":"D","v":"除名 开除党籍"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":284,"type":"single","stem":"党员领导干部对违反政治纪律和政治规矩等错误思想和行为不报告、不抵制、不斗争，放任不管，搞无原则一团和气，造成不良影响的，给予警告或者严重警告处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"严重警告或者撤销党内职务"},{"k":"B","v":"严重警告或者留党察看"},{"k":"C","v":"撤销党内职务或者留党察看"},{"k":"D","v":"留党察看或者开除党籍"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":285,"type":"single","stem":"在干部选拔任用工作中，有任人唯亲、排斥异己、封官许愿、说情干预、跑官要官、突击提拔或者调整干部等违反干部选拔任用规定行为，对直接责任者和领导责任者，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"劝其退党"},{"k":"B","v":"勒令退党"},{"k":"C","v":"党内除名"},{"k":"D","v":"开除党籍"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":286,"type":"single","stem":"驻外机构或者临时出国（境）团（组）中的党员，脱离组织出走时间不满______又自动回归的，给予撤销党内职务或者留党察看处分；脱离组织出走时间超过______的，按照自行脱党处理，党内予以除名。","opts":[{"k":"A","v":"三个月 三个月"},{"k":"B","v":"六个月 六个月"},{"k":"C","v":"九个月 九个月"},{"k":"D","v":"一年 一年"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":287,"type":"single","stem":"党员干部必须正确行使人民赋予的权力，清正廉洁，______任何滥用职权、谋求私利的行为。","opts":[{"k":"A","v":"反对"},{"k":"B","v":"避免"},{"k":"C","v":"应当反对"},{"k":"D","v":"尽量避免"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":288,"type":"single","stem":"纵容、默许配偶、子女及其配偶等亲属、身边工作人员______利用党员干部本人职权或者职务上的影响谋取私利，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"及其配偶、子女"},{"k":"B","v":"及其配偶、亲属"},{"k":"C","v":"和其他关系人"},{"k":"D","v":"和其他特定关系人"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":289,"type":"single","stem":"收受可能影响公正执行公务的礼品、礼金、消费卡和______等财物，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"有价证券、股权、其他金融产品"},{"k":"B","v":"汽车、房产"},{"k":"C","v":"电脑、汽车、房产"},{"k":"D","v":"有价证券、债券、其他金融产品"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":290,"type":"single","stem":"向从事公务的人员及其配偶、子女及其配偶等亲属和其他特定关系人赠送明显超出正常礼尚往来的礼品、礼金、消费卡和______等财物，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。","opts":[{"k":"A","v":"汽车、房产"},{"k":"B","v":"有价证券、股权、其他金融产品"},{"k":"C","v":"电脑、汽车、房产"},{"k":"D","v":"有价证券、债券"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":291,"type":"single","stem":"党员领导干部的配偶、子女及其配偶，违反有关规定在该党员领导干部管辖的地区和业务范围内从事可能影响其公正执行公务的经营活动，或者在该党员领导干部管辖的地区和业务范围内的外商独资企业、中外合资企业中担任由外方委派、聘任的高级职务或者违规任职、兼职取酬的，该党员领导干部应当按照规定予以纠正；拒不纠正的，其本人应当辞去现任职务或者由组织予以调整职务；不辞去现任职务或者不服从组织调整职务的，给予______处分。","opts":[{"k":"A","v":"严重警告"},{"k":"B","v":"撤销党内职务"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":292,"type":"single","stem":"利用职权或者职务上的影响，违反有关规定占用公物归个人使用，时间超过______，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分。","opts":[{"k":"A","v":"一个月"},{"k":"B","v":"三个月"},{"k":"C","v":"六个月"},{"k":"D","v":"一年"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":293,"type":"single","stem":"利用宗族或者黑恶势力等欺压群众，或者纵容涉黑涉恶活动、为黑恶势力充当“保护伞”的，给予______处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"警告或严重警告"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"撤销党内职务或者留党察看"},{"k":"D","v":"留党察看或者开除党籍"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":294,"type":"single","stem":"盲目举债、铺摊子、上项目，搞劳民伤财的“形象工程”、“政绩工程”，致使国家、集体或者群众财产和利益遭受较大损失的，对直接责任者和领导责任者，给予______处分；情节严重的，给予撤销党内职务、留党察看或者开除党籍处分。","opts":[{"k":"A","v":"警告或严重警告"},{"k":"B","v":"警告或者撤销党内职务"},{"k":"C","v":"严重警告或者撤销党内职务"},{"k":"D","v":"严重警告或者留党察看"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":295,"type":"single","stem":"工作中不负责任或者疏于管理，贯彻执行、检查督促落实上级决策部署不力，给党、国家和人民利益以及公共财产造成较大损失的，对直接责任者和领导责任者，给予警告或者严重警告处分；造成重大损失的，给予撤销党内职务、留党察看或者开除党籍处分。贯彻创新、协调、绿色、开放、共享的发展理念不力，对职责范围内的问题失察失责，造成较大损失或者重大损失的，______处分。","opts":[{"k":"A","v":"从轻或者减轻"},{"k":"B","v":"从重或者加重"},{"k":"C","v":"酌情给予"},{"k":"D","v":"免除"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":296,"type":"single","stem":"在上级检查、视察工作或者向上级汇报、报告工作时对应当报告的事项不报告或者不如实报告，造成严重损害或者严重不良影响的，对直接责任者和领导责任者，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或留党察看处分。在上级检查、视察工作或者向上级汇报、报告工作时纵容、唆使、暗示、强迫下级说假话、报假情的，______处分。","opts":[{"k":"A","v":"从重"},{"k":"B","v":"加重"},{"k":"C","v":"从重或者加重"},{"k":"D","v":"从轻或者减轻"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":297,"type":"single","stem":"党员领导干部违反有关规定干预和插手司法活动、执纪执法活动，向有关地方或者部门______、打招呼、说情，或者以其他方式对司法活动、执纪执法活动施加影响，情节较轻的，给予严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"提供线索"},{"k":"B","v":"进行举报"},{"k":"C","v":"打听案情"},{"k":"D","v":"跑风漏气"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":298,"type":"single","stem":"在考试、录取工作中，有泄露试题、考场舞弊、涂改考卷、违规录取等违反有关规定行为的，给予警告或者严重警告处分；情节较重的，给予______处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"严重警告或者留党察看"},{"k":"B","v":"严重警告或者撤销党内职务"},{"k":"C","v":"撤销党内职务或者留党察看"},{"k":"D","v":"留党察看或者开除党籍"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":299,"type":"single","stem":"在党的纪律检查、组织、宣传、统一战线工作以及机关工作等其他工作中，不履行或者不正确履行职责，造成损失或者不良影响的，应当视具体情节给予______处分。","opts":[{"k":"A","v":"警告直至开除党籍"},{"k":"B","v":"严重警告直至开除党籍"},{"k":"C","v":"警告直至留党察看"},{"k":"D","v":"警告直至撤销党内职务"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":300,"type":"single","stem":"党员领导干部不重视家风建设，对配偶、子女及其配偶失管失教，造成不良影响或者严重后果的，给予警告或者严重警告处分；情节严重的，给予______处分。","opts":[{"k":"A","v":"严重警告"},{"k":"B","v":"撤销党内职务"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":301,"type":"single","stem":"违背社会公序良俗，在公共场所有不当行为，造成不良影响的，给予______处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。","opts":[{"k":"A","v":"警告或严重警告"},{"k":"B","v":"撤销党内职务"},{"k":"C","v":"留党察看"},{"k":"D","v":"开除党籍"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":302,"type":"single","stem":"新修订的《中国共产党纪律处分条例》自______起施行。","opts":[{"k":"A","v":"2018年10月1日"},{"k":"B","v":"2023年12月8日"},{"k":"C","v":"2023年12月19日"},{"k":"D","v":"2024年1月1日"}],"ans":"D","src":"培训班复习资料·党纪条例","know":"2023年12月8日中共中央政治局会议第三次修订，2023年12月19日中共中央发布，共三编十一章158条，自2024年1月1日起施行。三个日期要分清：修订日12月8日、发布日12月19日、施行日2024年1月1日。原题选项全部停留在2018年版，与本题库 id254 自相矛盾，已按现行条例统一。"},{"id":303,"type":"single","stem":"《纪律处分条例》规定了纪律处分的运用规则，以下______不符合这一规则要求。","opts":[{"k":"A","v":"何某主动上交违纪所得的，因此从轻处分"},{"k":"B","v":"龚某强迫他人违纪，因此加重处分"},{"k":"C","v":"廖某受党纪处分后，又被发现其受处分前的违纪行为应当受到党纪处分，因此从重处分"},{"k":"D","v":"韩某违犯党纪，因有其他立功表现，由撤销党内职务改为免去现职，免予党纪处分"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":304,"type":"single","stem":"2015年10月，某县接到了关于省委巡视组即将进驻的通知。县委书记樊某在安排巡视进驻准备工作时强调，要保证举报箱的位置在监控可视范围内，以此掌握举报人和举报情况。11月初，省委巡视组按时进驻该县开展巡视，县公安局把县委和信访局附近的2个摄像头，对准省委巡视组设立的2个举报箱。不久，省委巡视组根据群众反映到实地查看，发现这一情况后，责令该县立即改正，并对樊某进行了严肃处理。请问樊某行为违反了什么纪律？","opts":[{"k":"A","v":"政治纪律"},{"k":"B","v":"组织纪律"},{"k":"C","v":"廉洁纪律"},{"k":"D","v":"工作纪律"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":305,"type":"single","stem":"2013年5月，某市局副局长郭某在得知另一副局长李某任前公示的消息后，心中充满了嫉妒，随即编造了李某花钱买官的虚假举报材料，并采取匿名方式分别寄给了省市多名领导，并将编好的\"某市花5万可以买到局长官位\"的举报材料发给其侄，其侄将该材料发布到网络论坛，致使该贴被点击29100余次，回复850次，转载多次，在社会造成了恶劣影响。请问郭某的行为违反了什么纪律？","opts":[{"k":"A","v":"政治纪律"},{"k":"B","v":"组织纪律"},{"k":"C","v":"生活纪律"},{"k":"D","v":"工作纪律"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":306,"type":"single","stem":"在上级机关开展土地清理督查过程中，发现某市一老板违规开发高尔夫球场，于是对其下发了整改通知，并提出停工处理意见。市委书记郭某平日里与这个老板交往甚密，郭某不但没有立即督促整改，还向有关部门打招呼、说情干预，因此受到党纪处分。请问郭某行为违反了什么纪律？","opts":[{"k":"A","v":"政治纪律"},{"k":"B","v":"组织纪律"},{"k":"C","v":"工作纪律"},{"k":"D","v":"生活纪律"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":307,"type":"single","stem":"赵某在担任某市房管局局长期间，与初中同学汪某（房地产老板）关系较好，且双方在婚丧嫁娶等红白喜事中素有来往。汪某儿子结婚，赵某前往祝贺，并随礼2000元。次年，赵某女儿结婚，汪某夫妇前来祝贺，并送上一份2万美元的大礼。请问赵某的行为如何处理？","opts":[{"k":"A","v":"礼尚往来，不违纪"},{"k":"B","v":"收受明显超出正常礼尚往来礼金，违反廉洁纪律"},{"k":"C","v":"违反组织纪律"},{"k":"D","v":"违反生活纪律"}],"ans":"B","src":"培训班复习资料·党纪条例"},{"id":308,"type":"single","stem":"2015年5月，某县文化局局长李某等人到省广播电台商洽\"文化科技卫生\"三下乡演出活动有关事宜。午餐后，李某与司机到省广电局停车场取车，发现自己乘坐的车辆被一辆大众牌轿车堵住无法驶离。李某气愤之下，直接将大众牌轿车雨刮器掰断扔到地上。当返回省广播大厦找到大众牌轿车车主张某时，在办公区域大声辱骂张某没有职业道德。请问李某的行为该如何处理。","opts":[{"k":"A","v":"对李某不应该处理"},{"k":"B","v":"李某行为违反民事法律规定"},{"k":"C","v":"李某违背社会公序良俗，在公共场所有不当行为，并造成不良影响，其行为已构成违反生活纪律，应给予相应纪律处分"},{"k":"D","v":"李某行为违反群众纪律，可以对其批评教育"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":309,"type":"single","stem":"河北省承德市兴隆县森林公安局干警崔承有、高孝全接群众报警后，对群众反映问题未及时处理，致使案件长达22个月未查结，造成不良影响。崔承有、高孝全分别受到党内警告处分。请问崔承有、高孝全行为违反了什么纪律？","opts":[{"k":"A","v":"政治纪律"},{"k":"B","v":"组织纪律"},{"k":"C","v":"群众纪律"},{"k":"D","v":"生活纪律"}],"ans":"C","src":"培训班复习资料·党纪条例"},{"id":310,"type":"single","stem":"2015年2月24日，海南省海口市龙华区秀英村经济社组队参加某篮球决赛期间，为庆祝夺冠，组织运动员、啦啦队等约80人到海口某酒楼集体用餐，共开支1.9万余元。2015年11月，经济社主任邓和云、副主任周昌文、监事会主席唐明光分别受到党内警告处分。请问邓和云等人行为违反了什么纪律？","opts":[{"k":"A","v":"廉洁纪律"},{"k":"B","v":"工作纪律"},{"k":"C","v":"财经纪律"},{"k":"D","v":"生活纪律"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":311,"type":"single","stem":"2015年11月，我省某市行政服务中心工程项目施工招投标结束后，参与招投标监督的市纪委工作人员李某收受中标单位2000元劳务费。请问对李某的行为应该如何处理？","opts":[{"k":"A","v":"收缴李某2000元上交财政，但可以不处分"},{"k":"B","v":"收缴李某2000元上交财政，并作出深刻检查"},{"k":"C","v":"收缴李某2000元上交财政，在全市范围进行通报"},{"k":"D","v":"对李某行为按收受“红包”处理，先免职再处分，并收缴李某违纪所得2000元上交财政"}],"ans":"D","src":"培训班复习资料·党纪条例"},{"id":312,"type":"single","stem":"2015年4月，贵州省天柱县民政局私设\"小金库\"、违规发放福利，民政局党组书记、局长刘余超受到党内严重警告，并被免职；党组成员、副局长杨长镠受到党内严重警告，并被免职；党组成员、纪检组长王瑞辉受到党内警告处分，并被免职。在该起案件中，刘余超、杨长镠、王瑞辉分别承担什么责任？","opts":[{"k":"A","v":"刘余超负主体责任，杨长镠负主体责任，王瑞辉负监督责任"},{"k":"B","v":"刘余超、杨长镠、王瑞辉都是负主体责任"},{"k":"C","v":"刘余超、杨长镠、王瑞辉都是负监督责任"},{"k":"D","v":"刘余超负主体责任，杨长镠负监督责任，王瑞辉负监督责任"}],"ans":"A","src":"培训班复习资料·党纪条例"},{"id":313,"type":"judge","stem":"中国共产党第一次全国代表大会于1921年7月23日至8月初在上海召开。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":314,"type":"judge","stem":"十八大以来，以习近平同志为主要代表的中国共产党人，顺应时代发展，从理论和实践结合上系统回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义这个重大时代课题，创立了习近平新时代中国特色社会主义思想。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":315,"type":"judge","stem":"中国共产党章程是中国共产党最根本的党内法规。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":316,"type":"judge","stem":"中国共产党第二十届中央委员会第三次全体会议于2024年7月15日至18日在北京举行。审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":317,"type":"judge","stem":"党除了工人阶级和最广大人民群众的利益，没有自己特殊的利益。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":318,"type":"judge","stem":"党的纪律处分按照从轻到重的顺序有五种：撤销党内职务、警告、留党察看、严重警告、开除党籍。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","src":"结业考试题库"},{"id":319,"type":"judge","stem":"二十大党章要求，弘扬坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争、对党忠诚、不负人民的伟大建党精神。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":320,"type":"judge","stem":"中国式现代化的特征：是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协调的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":321,"type":"judge","stem":"从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":322,"type":"judge","stem":"党的二十大报告指出：“教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑”。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":323,"type":"judge","stem":"1928年2月23日,根据中共广东省委指示,中共宝安县委在燕川村素白陈公祠召开第一次党员代表大会。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":324,"type":"fill","stem":"基层党委或县级党委组织部门应当对发展对象进行短期集中培训，培训时间一般不少于三天______。","opts":[],"ans":"或不少于二十四个学时","src":"结业考试题库"},{"id":325,"type":"judge","stem":"预备党员的预备期为1年，预备党员的义务同正式党员是一样的，预备党员的权利，除了没有表决权、选举权和被选举权以外，也同正式党员一样。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":326,"type":"judge","stem":"中国共产党党员永远是劳动人民的普通一员。除了法律和政策规定范围内的个人利益和工作职权以外，所有共产党员都不得谋求任何私利和特权。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":327,"type":"fill","stem":"《中国共产党党章》规定，党必须在______和法律的范围内活动。","opts":[],"ans":"宪法","src":"结业考试题库"},{"id":328,"type":"judge","stem":"要把承认党的纲领和章程、自觉为党的路线和纲领而奋斗、经过长期考验、符合党员条件的其他社会阶层的先进分子吸收到党内来,增强党在全社会的影响力和凝聚力。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","src":"结业考试题库"},{"id":329,"type":"judge","stem":"学 想确保它们得以实现，是它们的理论支撑。","id":372},{"type":"multi","stem":"健全全面从严治党体系，围绕五个层面提出了目标任务，包括（　）。","opts":[{"k":"A","v":"上下贯通、执行有力的组织体系"},{"k":"B","v":"固本培元、凝心铸魂的教育体系"},{"k":"C","v":"精准发力、标本兼治的监管体系"},{"k":"D","v":"科学完备、有效管用的制度体系"}],"ans":"ABCD","know":"还有第五个：主体明确、要求清晰的责任体系。五个体系对应管党治党内容全涵盖、对象全覆盖、责任全链条、制度全贯通。","id":373},{"type":"multi","stem":"学习贯彻习近平党建思想的要求包括（　）。","opts":[{"k":"A","v":"组织推动党员、干部读原著学原文悟原理"},{"k":"B","v":"深刻领悟「两个确立」的决定性意义、坚决做到「两个维护」"},{"k":"C","v":"开展体系化学理化研究阐释"},{"k":"D","v":"以更高标准、更实举措抓好全面从严治党各项工作"}],"ans":"ABCD","know":"学习贯彻习近平党建思想是当前和今后一个时期全党的一项重要政治任务。","id":374},{"type":"judge","stem":"习近平党建思想是习近平新时代中国特色社会主义思想的重要组成部分，对强党强国具有重大现实意义和长远指导意义。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"2026年6月15日全国党建工作座谈会指出：习近平党建思想是加强新时代党的建设的根本遵循。","id":375},{"type":"judge","stem":"习近平党建思想的「十四个坚持」与2023年全国组织工作会议概括的「十三个坚持」内容完全相同，只是数量的简单调整。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","know":"两者是同一思想在不同阶段的理论概括，但内涵已有深化拓展（新增「坚持党中央集中统一领导」等），不是简单的数量替换。","id":376},{"type":"judge","stem":"习近平党建思想只源自马克思主义科学理论，与中华优秀传统文化无关。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","know":"三大来源：源自马克思主义科学理论、植根中华优秀传统文化、孕育于新时代全面从严治党的伟大实践。","id":377},{"type":"judge","stem":"健全全面从严治党体系是党的二十大首次提出的重大举措。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"党的二十大从7个方面部署深入推进新时代党的建设新的伟大工程，首次提出「健全全面从严治党体系」。","id":378},{"type":"fill","stem":"习近平党建思想的科学内涵集中概括为「______」。","opts":[],"ans":"十四个坚持","know":"2026年6月全国党建工作座谈会概括凝练。","id":379},{"type":"fill","stem":"习近平党建思想以坚持和加强党中央集中统一领导为______，以忠诚为党护党、全力兴党强党为______，以解决大党独有难题、健全全面从严治党体系为______。","opts":[],"ans":"最高原则；根本使命；重大任务","know":"三个定位是高频易错点，务必成组记忆。","id":380},{"type":"qa","stem":"请简述习近平党建思想的科学内涵「十四个坚持」。","opts":[],"ans":"坚持党的领导是中国特色社会主义最本质的特征；坚持党中央集中统一领导；坚持全面从严治党；坚持不忘初心、牢记使命；坚持以党的政治建设为统领；坚持用党的创新理论凝心铸魂；坚持锤炼坚强党性；坚持健全上下贯通、执行有力的组织体系；坚持建设堪当民族复兴重任的高素质干部队伍；坚持推进作风建设常态化长效化；坚持用严明的纪律管全党治全党；坚持一体推进不敢腐、不能腐、不想腐；坚持制度治党、依规治党；坚持落实管党治党政治责任。","know":"逻辑结构「总—分—总」：前四条总论、中间九条分论（政治/思想/组织/作风/纪律建设、反腐败斗争、制度建设）、最后一条保障。","id":381},{"type":"single","stem":"庆祝中国共产党成立105周年大会于（　）在北京人民大会堂隆重举行。","opts":[{"k":"A","v":"2026年6月15日"},{"k":"B","v":"2026年7月1日"},{"k":"C","v":"2025年7月1日"},{"k":"D","v":"2026年10月1日"}],"ans":"B","know":"2026年7月1日，习近平在大会上为「七一勋章」获得者颁授勋章并发表重要讲话。","id":382},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中，习近平总书记指出，105年来我们党始终坚守（　）的初心使命。","opts":[{"k":"A","v":"为中国人民谋幸福、为中华民族谋复兴"},{"k":"B","v":"为中华民族谋幸福、为中国人民谋复兴"},{"k":"C","v":"全心全意为人民服务"},{"k":"D","v":"实现共产主义"}],"ans":"A","know":"这是中国共产党人的初心使命，也是105周年大会讲话的主线表述。","id":383},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中，用几个方面概括了「105年不懈奋斗」的伟大意义？","opts":[{"k":"A","v":"三个方面"},{"k":"B","v":"四个方面"},{"k":"C","v":"五个方面"},{"k":"D","v":"六个方面"}],"ans":"C","know":"五个方面：①从根本上改变了中国人民的前途命运 ②开辟了实现中华民族伟大复兴的正确道路 ③展示了马克思主义的强大生命力 ④深刻影响了世界历史进程 ⑤锻造了强大的中国共产党。","id":384},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中，把中国共产党「为什么能」的关键密码概括为（　）。","opts":[{"k":"A","v":"五个「必须」"},{"k":"B","v":"六个优秀特质"},{"k":"C","v":"九个必须"},{"k":"D","v":"十个坚持"}],"ans":"B","know":"六个优秀特质：矢志追求真理、深深植根人民、勇担历史使命、顺应发展潮流、敢于善于斗争、注重强健自身。","id":385},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中，「三个务必」指的是（　）。","opts":[{"k":"A","v":"务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争"},{"k":"B","v":"务必不忘初心、牢记使命，务必艰苦奋斗、勤俭节约，务必敢于斗争、善于斗争"},{"k":"C","v":"务必谦虚谨慎、艰苦奋斗，务必实事求是、求真务实，务必敢于斗争、善于斗争"},{"k":"D","v":"务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必团结协作、攻坚克难"}],"ans":"A","know":"「三个务必」是党的二十大提出的重要要求，105周年大会讲话再次重申。","id":386},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中，提出要推动落实的全球倡议不包括（　）。","opts":[{"k":"A","v":"全球发展倡议"},{"k":"B","v":"全球安全倡议"},{"k":"C","v":"全球文明倡议"},{"k":"D","v":"全球减贫倡议"}],"ans":"D","know":"讲话提出推动落实全球发展倡议、全球安全倡议、全球文明倡议、**全球治理倡议**。四个倡议是新提法，注意「全球治理倡议」为新增。","id":387},{"type":"single","stem":"党的百年奋斗「十个坚持」的历史经验，是在（　）上系统总结的。","opts":[{"k":"A","v":"党的十九大"},{"k":"B","v":"庆祝中国共产党成立100周年大会"},{"k":"C","v":"党的十九届六中全会"},{"k":"D","v":"党的二十大"}],"ans":"C","know":"党的十九届六中全会通过党的第三个历史决议《中共中央关于党的百年奋斗重大成就和历史经验的决议》，以「十个坚持」总结百年奋斗历史经验。","id":388},{"type":"single","stem":"党的历史上第三个历史决议是（　）。","opts":[{"k":"A","v":"《关于若干历史问题的决议》"},{"k":"B","v":"《关于建国以来党的若干历史问题的决议》"},{"k":"C","v":"《中共中央关于全面深化改革若干重大问题的决定》"},{"k":"D","v":"《中共中央关于党的百年奋斗重大成就和历史经验的决议》"}],"ans":"D","know":"三个历史决议：1945年第一个、1981年第二个、2021年十九届六中全会第三个。第三个的历史地位：马克思主义的纲领性文献、政治宣言、行动指南。","id":389},{"type":"single","stem":"学习党史要做到「学史明理、学史增信、学史崇德、（　）」。","opts":[{"k":"A","v":"学史力行"},{"k":"B","v":"学史用史"},{"k":"C","v":"学史践悟"},{"k":"D","v":"学史笃行"}],"ans":"B","know":"党史学习教育四句话：学史明理、学史增信、学史崇德、学史力行。","id":390},{"type":"single","stem":"习近平总书记指出，伟大建党精神是中国共产党的（　）。","opts":[{"k":"A","v":"精神之源"},{"k":"B","v":"精神之基"},{"k":"C","v":"精神之魂"},{"k":"D","v":"政治品格"}],"ans":"A","know":"伟大建党精神（32字）：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民——是中国共产党的精神之源。","id":391},{"type":"single","stem":"「四史」教育指的是学习（　）。","opts":[{"k":"A","v":"党史、国史、军史、改革开放史"},{"k":"B","v":"党史、新中国史、改革开放史、社会主义发展史"},{"k":"C","v":"党史、新中国史、改革开放史、中华民族发展史"},{"k":"D","v":"党史、新中国史、社会主义建设史、改革开放史"}],"ans":"B","know":"「四史」＝党史、新中国史、改革开放史、社会主义发展史。","id":392},{"type":"single","stem":"根据《党史学习教育工作条例》，全面系统学习党史要学习党在新民主主义革命时期、社会主义革命和建设时期、改革开放和社会主义现代化建设新时期、中国特色社会主义新时代的历史（「四个时期历史」），还要学习党的五个方面历史，即党的不懈奋斗史、不怕牺牲史、理论探索史、（　）、自身建设史。","opts":[{"k":"A","v":"理论创新史"},{"k":"B","v":"群众工作史"},{"k":"C","v":"为民造福史"},{"k":"D","v":"作风建设史"}],"ans":"C","know":"「四个时期历史」＋「五个方面历史」构成党史的基本框架和基本内容。","id":393},{"type":"single","stem":"在庆祝中国共产党成立105周年大会上的讲话中指出，我们党仅用几十年时间就走完发达国家几百年走过的工业化历程，创造了（　）两大奇迹。","opts":[{"k":"A","v":"经济快速发展和社会长期稳定"},{"k":"B","v":"经济高速增长和社会全面进步"},{"k":"C","v":"经济快速发展和科技自立自强"},{"k":"D","v":"综合国力跃升和人民生活改善"}],"ans":"A","know":"「两大奇迹」是党领导人民在改革开放和社会主义现代化建设实践中创造的。","id":394},{"type":"multi","stem":"在庆祝中国共产党成立105周年大会上的讲话中，「105年不懈奋斗」包括（　）。","opts":[{"k":"A","v":"从根本上改变了中国人民的前途命运"},{"k":"B","v":"开辟了实现中华民族伟大复兴的正确道路"},{"k":"C","v":"展示了马克思主义的强大生命力"},{"k":"D","v":"深刻影响了世界历史进程"},{"k":"E","v":"锻造了强大的中国共产党"}],"ans":"ABCDE","know":"五个方面构成讲话对105年奋斗历程的整体评价框架。","id":395},{"type":"multi","stem":"在庆祝中国共产党成立105周年大会上的讲话中，概括的党的优秀特质包括（　）。","opts":[{"k":"A","v":"矢志追求真理，始终把准前进方向"},{"k":"B","v":"深深植根人民，始终拥有坚实根基"},{"k":"C","v":"勇担历史使命，始终掌握战略主动"},{"k":"D","v":"顺应发展潮流，始终走在时代前列"}],"ans":"ABCD","know":"六个优秀特质还包括：敢于善于斗争、始终保持必胜信心；注重强健自身、始终充满生机活力。这些是中国共产党「为什么能」的关键密码。","id":396},{"type":"multi","stem":"在庆祝中国共产党成立105周年大会上的讲话中，对「坚定信心、接续奋斗」提出了哪些「必须」？（　）","opts":[{"k":"A","v":"必须坚持党的基本理论、基本路线、基本方略"},{"k":"B","v":"必须紧紧依靠人民创造历史伟业"},{"k":"C","v":"必须积极应对前进道路上的风险挑战"},{"k":"D","v":"必须持续推动构建人类命运共同体"},{"k":"E","v":"必须持之以恒推进全面从严治党"}],"ans":"ABCDE","know":"五个「必须」是新征程上接续奋斗的行动要求，其中「持之以恒推进全面从严治党」明确要求全面贯彻新时代党建思想。","id":397},{"type":"multi","stem":"党的百年奋斗「十个坚持」历史经验包括（　）。","opts":[{"k":"A","v":"坚持党的领导"},{"k":"B","v":"坚持人民至上"},{"k":"C","v":"坚持理论创新"},{"k":"D","v":"坚持独立自主"},{"k":"E","v":"坚持中国道路"}],"ans":"ABCDE","know":"完整十条：坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争、坚持统一战线、坚持自我革命。","id":398},{"type":"multi","stem":"党的历史上的三个历史决议包括（　）。","opts":[{"k":"A","v":"1945年《关于若干历史问题的决议》"},{"k":"B","v":"1981年《关于建国以来党的若干历史问题的决议》"},{"k":"C","v":"2021年《中共中央关于党的百年奋斗重大成就和历史经验的决议》"},{"k":"D","v":"2024年《中共中央关于进一步全面深化改革、推进中国式现代化的决定》"},{"k":"E","v":"2025年《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》"}],"ans":"ABC","know":"三个历史决议都在重大历史关头统一了全党思想和行动。D、E不是历史决议。","id":399},{"type":"judge","stem":"在庆祝中国共产党成立105周年大会上，习近平总书记为「七一勋章」获得者颁授勋章并发表重要讲话。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"2026年7月1日上午，大会在北京人民大会堂举行，习近平颁授「七一勋章」并为全国「两优一先」代表颁奖。","id":400},{"type":"judge","stem":"在庆祝中国共产党成立105周年大会上的讲话中，习近平总书记强调「时间不等人！历史不等人！」。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"讲话结尾：全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争，奋力创造新的历史辉煌。","id":401},{"type":"judge","stem":"「九个必须」是习近平总书记在庆祝中国共产党成立105周年大会上总结的宝贵经验。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"B","know":"「九个必须」是2021年庆祝中国共产党成立**100周年**大会讲话总结的；105周年大会讲话概括的是**六个优秀特质**和**五个「必须」**。","id":402},{"type":"judge","stem":"伟大建党精神的基本内涵是坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。","opts":[{"k":"A","v":"正确"},{"k":"B","v":"错误"}],"ans":"A","know":"32字伟大建党精神，2021年七一讲话首次提出，是中国共产党的精神之源。","id":403},{"type":"fill","stem":"在庆祝中国共产党成立105周年大会上的讲话中指出，105年来我们党始终坚守______的初心使命。","opts":[],"ans":"为中国人民谋幸福、为中华民族谋复兴","know":"初心使命的规范表述。","id":404},{"type":"fill","stem":"在庆祝中国共产党成立105周年大会上的讲话中指出，「功崇惟志，______。」","opts":[],"ans":"业广惟勤","know":"语出《尚书》，讲话用以勉励全党坚定信心、接续奋斗。","id":405},{"type":"fill","stem":"在庆祝中国共产党成立105周年大会上的讲话中指出，强国必须强军，______。","opts":[],"ans":"军强才能国安","know":"讲话对国防和军队现代化的要求：如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队。","id":406},{"type":"fill","stem":"「四史」教育是指学习______、______、______、______。","opts":[],"ans":"党史；新中国史；改革开放史；社会主义发展史","know":"「四史」学习是党史学习教育常态化长效化的重要内容。","id":407},{"type":"fill","stem":"党的第三个历史决议是2021年党的十九届六中全会通过的《______》。","opts":[],"ans":"中共中央关于党的百年奋斗重大成就和历史经验的决议","know":"三个历史决议：1945年、1981年、2021年。","id":408},{"type":"qa","stem":"请简述党的百年奋斗「十个坚持」历史经验。","opts":[],"ans":"坚持党的领导，坚持人民至上，坚持理论创新，坚持独立自主，坚持中国道路，坚持胸怀天下，坚持开拓创新，坚持敢于斗争，坚持统一战线，坚持自我革命。","know":"党的十九届六中全会通过的第三个历史决议概括。口诀：党、民、理、独立、道路、天下、创新、斗争、统战、革命。","id":409},{"type":"qa","stem":"请简述习近平总书记在庆祝中国共产党成立105周年大会上的讲话中概括的「六个优秀特质」。","opts":[],"ans":"矢志追求真理，始终把准前进方向；深深植根人民，始终拥有坚实根基；勇担历史使命，始终掌握战略主动；顺应发展潮流，始终走在时代前列；敢于善于斗争，始终保持必胜信心；注重强健自身，始终充满生机活力。","know":"这六个特质是「中国共产党为什么能」的关键密码，要结合新的实际不断发扬光大。","id":410},{"type":"single","stem":"习近平总书记指出，政绩观问题是一个（　）问题，关乎立党为公、执政为民。","opts":[{"k":"A","v":"根本性"},{"k":"B","v":"全局性"},{"k":"C","v":"长期性"},{"k":"D","v":"原则性"}],"ans":"A","know":"《求是》杂志2026年第7期发表习近平总书记重要文章《树立和践行正确政绩观》，这是2012年12月至2026年2月期间有关重要论述的节录。","id":411},{"type":"single","stem":"树立和践行正确政绩观，要科学回答「政绩为谁而树、（　）、靠什么树政绩」等重大问题。","opts":[{"k":"A","v":"树多大的政绩"},{"k":"B","v":"树什么样的政绩"},{"k":"C","v":"什么时候树政绩"},{"k":"D","v":"树给谁看政绩"}],"ans":"B","know":"三问是正确政绩观的核心框架：为谁而树（价值立场）、树什么样（检验标准）、靠什么树（实现途径）。","id":412},{"type":"single","stem":"习近平总书记反复强调，共产党人必须牢记，（　）是最大政绩。","opts":[{"k":"A","v":"为民造福"},{"k":"B","v":"经济增长"},{"k":"C","v":"项目落地"},{"k":"D","v":"群众满意度测评"}],"ans":"A","know":"政绩之本在于为民。干事业、创政绩，为的是造福人民，不是为了个人升迁得失。","id":413},{"type":"single","stem":"树立和践行正确政绩观，起决定性作用的是（　）。","opts":[{"k":"A","v":"能力水平"},{"k":"B","v":"党性"},{"k":"C","v":"工作方法"},{"k":"D","v":"考核机制"}],"ans":"B","know":"习近平总书记指出，只有党性坚强、摒弃私心杂念，才能保证政绩观不出偏差。","id":414},{"type":"single","stem":"习近平总书记指出，衡量党性强弱的根本尺子是（　）。","opts":[{"k":"A","v":"能力大小"},{"k":"B","v":"贡献多少"},{"k":"C","v":"公、私二字"},{"k":"D","v":"群众口碑"}],"ans":"C","know":"「公、私二字」是衡量党性的根本尺子，也是判断政绩观是否出偏差的基准。","id":415},{"type":"single","stem":"树立和践行正确政绩观，既要做让老百姓看得见、摸得着、得实惠的实事，也要做打基础、利长远的好事，既要做显功，也要做（　）。","opts":[{"k":"A","v":"实功"},{"k":"B","v":"潜功"},{"k":"C","v":"硬功"},{"k":"D","v":"苦功"}],"ans":"B","know":"显功与潜功的辩证关系，体现的正是「功成不必在我」的精神境界和「功成必定有我」的历史担当。","id":416},{"type":"single","stem":"习近平总书记要求，杜绝对群众急难愁盼问题漠然处之，杜绝（　）和「形象工程」、「政绩工程」。","opts":[{"k":"A","v":"新官不理旧账"},{"k":"B","v":"揭榜挂帅"},{"k":"C","v":"先立后破"},{"k":"D","v":"容错纠错"}],"ans":"A","know":"错误政绩观的典型表现：心浮气躁、急功近利、弄虚作假、盲目蛮干，搞「形象工程」「政绩工程」，留下包袱和隐患。","id":417},{"type":"single","stem":"习近平总书记要求在政绩考核中防止出现「（　）、官出数字」的恶性循环，完善差异化考核评价体系。","opts":[{"k":"A","v":"数字出彩"},{"k":"B","v":"数字造假"},{"k":"C","v":"数字出官"},{"k":"D","v":"数据出绩"}],"ans":"C","know":"要完善推动高质量发展的政绩考核评价办法，发挥好「指挥棒」作用。","id":418},{"type":"single","stem":"习近平总书记指出，要以（　）的精神境界和「功成必定有我」的历史担当，心无旁骛推进中国式现代化。","opts":[{"k":"A","v":"功成不必在我"},{"k":"B","v":"功成必定属我"},{"k":"C","v":"功成有我参与"},{"k":"D","v":"不必计较功名"}],"ans":"A","know":"「功成不必在我」讲的是胸怀和境界，「功成必定有我」讲的是责任和担当，两者统一于干事创业。","id":419},{"type":"single","stem":"党的二十届三中全会提出，落实（　），激励干部开拓进取、干事创业。","opts":[{"k":"A","v":"「两个责任」"},{"k":"B","v":"「三会一课」"},{"k":"C","v":"「一岗双责」"},{"k":"D","v":"「三个区分开来」"}],"ans":"D","know":"全会同时提出「树立和践行正确政绩观，健全有效防范和纠治政绩观偏差工作机制」。","id":420},{"type":"single","stem":"习近平总书记指出，「党性说到底就是（　）问题」。","opts":[{"k":"A","v":"作风"},{"k":"B","v":"立场"},{"k":"C","v":"纪律"},{"k":"D","v":"信仰"}],"ans":"B","know":"政绩为谁而树，是涉及坚守党性的原则问题。党性和人民性从来都是一致的、统一的。","id":421},{"type":"single","stem":"习近平总书记强调，要处理好稳和进、立和破、虚和实、（　）、近和远的关系，坚持底线思维，强化风险意识。","opts":[{"k":"A","v":"前和后"},{"k":"B","v":"内和外"},{"k":"C","v":"标和本"},{"k":"D","v":"加和减"}],"ans":"C","know":"五对关系是完整准确全面贯彻新发展理念、推动高质量发展的重要方法论。","id":422},{"type":"single","stem":"习近平总书记指出，「江山就是人民、人民就是江山，打江山、守江山，守的是（　）」。","opts":[{"k":"A","v":"人民的心"},{"k":"B","v":"国家的根"},{"k":"C","v":"民族的魂"},{"k":"D","v":"政权的基"}],"ans":"A","know":"这一论断深刻阐明了人民立 let AUDIO={},_ckSt={},_ckQ={},_ckSize=50;

function ensureAudio(cb,id){
  var c=ckOf(id==null?1:id);
  if(_ckSt[c]==='ok'){cb&&cb();return;}
  var q=_ckQ[c]||(_ckQ[c]=[]);
  if(cb)q.push(cb);
  if(_ckSt[c]==='loading')return;
  _ckSt[c]='loading';
  var s=document.createElement("script");
  s.src="audio_c"+c+".js?v=6.3";
  s.onload=function(){_ckSt[c]='ok';_refTip();var a=_ckQ[c].splice(0);for(var i=0;i<a.length;i++){try{a[i]();}catch(e){}}};
  s.onerror=function(){_ckSt[c]='err';_refTip();var a=_ckQ[c].splice(0);for(var i=0;i<a.length;i++){try{a[i]();}catch(e){}}};
  document.head.appendChild(s);
}

if('speechSynthesis' in window)speechSynthesis.getVoices();
function zhVoice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/zh[-_]?CN|chinese/i.test(v.lang+' '+v.name))||null;}
let curAudio=null;
function stopAudio(){if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;}}
function sysSpeak(text,onend){
  if(!('speechSynthesis' in window)){if(onend)onend();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=ttsRate;const v=zhVoice();if(v)u.voice=v;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
}
function speak(text,onend,id){
  stopSpeak();
  const b64=id!=null?AUDIO[id]:null;
  if(!b64){sysSpeak(text,onend);if(id!=null)ensureAudio(null,id);return;}
  const a=new Audio('data:audio/mpeg;base64,'+b64);
  curAudio=a;a.playbackRate=ttsRate;
  a.onended=function(){curAudio=null;if(onend)onend();};
  a.onerror=function(){curAudio=null;sysSpeak(text,onend);};
  a.play().catch(function(){curAudio=null;sysSpeak(text,onend);});
}
function stopSpeak(){stopAudio();if('speechSynthesis' in window)speechSynthesis.cancel();}
function correctPart(d){
  if(d.type==='judge')return d.ans==='A'?'正确':'错误';
  if(d.type==='single'){const o=d.opts.find(x=>x.k===d.ans);return o?o.v:d.ans;}
  if(d.type==='multi')return d.opts.filter(x=>d.ans.includes(x.k)).map(x=>x.v).join('；');
  return d.ans;
}
function correctText(d){return d.stem+' 答案：'+correctPart(d);}
function speakById(id){const d=DATA.find(x=>x.id===id);if(d)speak(correctText(d),null,id);}
const norm=s=>(s||'').replace(/[\s，。、；：""''（）()《》?？!！·\-—]/g,'').toLowerCase();

function go(s){$$('.screen').forEach(x=>x.classList.remove('on'));$$('.tab').forEach(t=>t.classList.remove('on'));
  if(s==='home'){$('#s-home').classList.add('on');$('.tab[data-s=home]').classList.add('on');$('#hdrBar').style.display='none';$('#hdrBarLab').style.display='none';renderHome();}
  else{$('#s-quiz').classList.add('on');const t=$('.tab[data-s='+s+']');if(t)t.classList.add('on');}}

/* ---- 收藏 ---- */
function starBtnHtml(d){return '<button class="spk star'+(S.star[d.id]?' on':'')+'" onclick="toggleStar('+d.id+')">'+(S.star[d.id]?'★':'☆')+'</button>';}
function toggleStar(id){
  if(S.star[id])delete S.star[id];else S.star[id]=1;save();
  if(mode==='browse')renderBrowse(bFilter,bQuery);else if(mode==='practice')renderQ();
}

function renderHome(){
  $('#hdrSub').textContent='共 '+DATA.length+' 题 · 2026 版';
  $('#stDone').textContent=Object.keys(S.done).length;
  $('#stAcc').textContent=S.answered?Math.round(S.correct/S.answered*100)+'%':'--';
  $('#stWrong').textContent=Object.keys(S.wrong).length;
  $('#tile-wrong').textContent=Object.keys(S.wrong).length?Object.keys(S.wrong).length+'题':'';
  $('#tile-star').textContent=Object.keys(S.star).length?Object.keys(S.star).length+'题':'';
  const doneCnt=Object.keys(S.done).length;
  $('#tile-undone').textContent=(DATA.length-doneCnt)>0?(DATA.length-doneCnt)+'题':'';
  const p=S.posAll||0;
  $('#tile-all').textContent=(p>0&&p<DATA.length)?'续 '+(p+1)+'/'+DATA.length:'';
  const cnt={};DATA.forEach(d=>cnt[d.type]=(cnt[d.type]||0)+1);
  $('#homeChips').innerHTML=['judge','single','multi','fill','qa'].map(t=>
    '<span class="chip" onclick="startQuizType(\''+t+'\')">'+TYPENAME[t]+' · '+cnt[t]+'</span>').join('');
  renderAcct();
  var fv=document.getElementById('footVer');if(fv)fv.innerHTML='版本 v6.3<span class="dotv"></span>题库 '+DATA.length+' 题<span class="dotv"></span>2026 版';
}
function startQuizType(t){const q=DATA.filter(d=>d.type===t);if(!q.length)return;beginPractice(q,TYPENAME[t]+'专项');}
function startQuiz(kind){
  if(kind==='wrong'){const w=Object.keys(S.wrong).map(Number);const q=DATA.filter(d=>w.includes(d.id));
    if(!q.length){alert('太棒了，暂时没有错题！');return;}beginPractice(q,'🔥 错题重练');}
  else if(kind==='star'){const st=Object.keys(S.star).map(Number);const q=DATA.filter(d=>st.includes(d.id));
    if(!q.length){alert('还没有收藏的题目。练习或背题时点 ☆ 即可收藏。');return;}beginPractice(q,'⭐ 收藏练习');}
  else if(kind==='undone'){const q=DATA.filter(d=>!S.done[d.id]);
    if(!q.length){alert('全部题目都做完了，太厉害了！');return;}beginPractice(q,'🧭 未做题');}
  else{
    const p=S.posAll||0;
    if(p>0&&p<DATA.length){
      if(confirm('上次顺序练习做到第 '+(p+1)+' 题，是否从上次位置继续？\n点「取消」则从头开始。'))beginPractice(DATA.slice(),'📝 顺序练习',p);
      else{S.posAll=0;save();beginPractice(DATA.slice(),'📝 顺序练习',0);}
    }else beginPractice(DATA.slice(),'📝 顺序练习',0);
  }
}
function beginPractice(q,title,startAt){mode='practice';list=q;idx=Math.max(0,Math.min(startAt||0,q.length-1));picked=new Set();revealed=false;curTitle=title||'';
  $('#hdrBar').style.display='block';$('#hdrBarLab').style.display='flex';go('practice');renderQ();}
function renderQ(){
  const d=list[idx];const total=list.length;
  if(curTitle==='📝 顺序练习'){S.posAll=idx;save();}
  $('#barFill').style.width=((idx)/total*100)+'%';
  $('#barProg').textContent=(idx+1)+'/'+total;
  $('#barScore').textContent='正确率 '+(S.answered?Math.round(S.correct/S.answered*100)+'%':'--');
  let h='<div class="back" onclick="go(\'home\')">‹ 返回首页'+(curTitle?' &nbsp;'+curTitle:'')+'</div>';
  h+='<div class="qcard"><span class="qno">第 '+(idx+1)+' / '+total+' 题</span><span class="qtag '+d.type+'">'+TYPENAME[d.type]+'</span>';
  h+='<div class="qstem">'+esc(d.stem)+'</div>';
  if(d.type==='judge'||d.type==='single'||d.type==='multi'){
    d.opts.forEach(o=>{let cls='opt';if(revealed){if(d.ans.includes(o.k))cls+=' right';else if(picked.has(o.k))cls+=' wrong';else cls+=' dim';}else if(picked.has(o.k))cls+=' sel';
      h+='<div class="'+cls+'" onclick="tapOpt(\''+o.k+'\')"><span class="k">'+o.k+'</span><span class="v">'+esc(o.v)+'</span></div>';});
    if(d.type==='multi'&&!revealed)h+='<div style="font-size:12px;color:var(--sub);margin:4px 0 10px">多选题：请选择所有正确项后提交</div>';
    if(!revealed&&d.type==='multi')h+='<button class="btn primary" style="width:100%;margin-top:6px" onclick="submitMulti()">提交答案</button>';
    if(revealed)h+='<div class="reveal">正确答案：<b>'+d.ans.split('').join('、')+'</b><button class="spk" onclick="speakById('+d.id+')">🔊</button>'+starBtnHtml(d)+'</div>'+knowHtml(d);
  }else{
    if(!revealed){h+='<input class="fillin" id="fillin" placeholder="先在心里作答，再点下方查看参考答案">';
      h+='<button class="btn gold" style="width:100%" onclick="reveal()">查看参考答案</button>';}
    else{h+='<div class="reveal">参考答案：<b>'+esc(d.ans)+'</b><button class="spk" onclick="speakById('+d.id+')">🔊</button>'+starBtnHtml(d)+'</div>'+knowHtml(d);
      h+='<div class="selfgrade"><button class="sg-ok" onclick="selfGrade(true)">✓ 记住了</button><button class="sg-no" onclick="selfGrade(false)">✗ 没记住</button></div>';}
  }
  h+='</div>';
  if(revealed){h+='<div class="navbtns"><button class="btn ghost" onclick="prev()">上一题</button><button class="btn primary" onclick="next()">'+(idx<list.length-1?'下一题 ›':'完成 ✓')+'</button></div>';}
  else if(d.type==='fill'||d.type==='qa'){h+='<div class="navbtns"><button class="btn ghost" onclick="prev()">上一题</button><button class="btn primary" onclick="next()">跳过 ›</button></div>';}
  else{h+='<div class="navbtns"><button class="btn ghost" onclick="prev()">上一题</button></div>';}
  $('#quizHost').innerHTML=h;
  window.scrollTo(0,0);
}
function tapOpt(k){const d=list[idx];
  if(revealed)return;
  if(d.type==='multi'){if(picked.has(k))picked.delete(k);else picked.add(k);renderQ();return;}
  picked=new Set([k]);grade(k===d.ans);
}
function submitMulti(){const d=list[idx];
  if(!picked.size){alert('请先选择至少一个选项');return;}
  grade([...picked].sort().join('')===d.ans.split('').sort().join(''));
}
function grade(correct){const d=list[idx];revealed=true;S.answered++;
  if(correct){S.correct++;delete S.wrong[d.id];}else{S.wrong[d.id]=1;}
  S.done[d.id]=1;save();renderQ();}
function reveal(){revealed=true;renderQ();}
function selfGrade(ok){const d=list[idx];
  if(ok){S.done[d.id]=1;delete S.wrong[d.id];}else{S.wrong[d.id]=1;}save();next();}
function next(){if(idx<list.length-1){idx++;picked=new Set();revealed=false;renderQ();}
  else{finish();}}
function prev(){if(idx>0){idx--;picked=new Set();revealed=false;renderQ();}}
function finish(){const pct=S.answered?Math.round(S.correct/S.answered*100):0;
  $('#quizHost').innerHTML='<div class="qcard"><div class="res"><div style="font-size:14px;color:var(--sub)">本次练习完成 🎉</div><div class="ring">'+pct+'<small>%</small></div><div style="color:var(--sub);font-size:13px">累计答题 '+S.answered+' 题 · 错题 '+Object.keys(S.wrong).length+' 题</div></div><div class="navbtns"><button class="btn ghost" onclick="go(\'home\')">返回首页</button><button class="btn primary" onclick="startQuiz(\'all\')">再来一轮</button></div></div>';
  $('#barFill').style.width='100%';}

/* ---- BROWSE ---- */
function openBrowse(){mode='browse';stopSpeak();ttsOn=false;bFilter='';bQuery='';go('browse');browseShell();renderBrowse('','');
  $('#hdrBar').style.display='none';$('#hdrBarLab').style.display='none';}
function browseShell(){
  $('#quizHost').innerHTML='<div style="font-size:15px;font-weight:700;margin:2px 0 10px;color:var(--navy)">📖 背题库（<span id="bcnt">共 '+DATA.length+' 题</span>）</div>'+
  '<input class="fillin" id="bsearch" placeholder="🔍 搜索题干 / 答案关键词" autocomplete="off" oninput="doSearch(this.value)" oncompositionend="doSearch(this.value)">'+
  '<div id="bchips"></div><div id="blist"></div>';
}
function renderBrowse(filter,q){
  if(!$('#bchips'))browseShell();
  bFilter=filter;bQuery=q||'';
  const nq=norm(bQuery);
  const items=DATA.filter(d=>{
    if(filter&&d.type!==filter)return false;
    if(!nq)return true;
    let hay=norm(d.stem)+' '+norm(d.ans||'');
    (d.opts||[]).forEach(o=>hay+=' '+norm(o.v));
    return hay.includes(nq);
  });
  const cnt=$('#bcnt');if(cnt)cnt.textContent=(nq?'命中 '+items.length:'共 '+items.length)+' 题';
  const ch=$('#bchips');
  if(ch)ch.innerHTML='<div class="chips"><span class="chip'+(!filter?' on':'')+'" onclick="renderBrowse(\'\',bQuery)">全部 '+DATA.length+'</span>'+
    ['judge','single','multi','fill','qa'].map(t=>'<span class="chip'+(filter===t?' on':'')+'" onclick="renderBrowse(\''+t+'\',bQuery)">'+TYPENAME[t]+'</span>').join('')+'</div>';
  let lh='';
  if(!items.length)lh='<div class="empty"><div class="e">🔍</div>没有匹配的题目</div>';
  items.forEach(d=>{lh+='<div class="browitem"><button class="spk" style="float:right" onclick="speakById('+d.id+')">🔊</button>'+starBtnHtml(d)+'<span class="qtag '+d.type+'">'+TYPENAME[d.type]+'</span><div class="qstem" style="font-size:15px;margin-bottom:6px">'+esc(d.stem)+'</div>';
    if(d.opts&&d.opts.length)lh+=d.opts.map(o=>'<div style="font-size:14px;color:'+(d.ans.includes(o.k)?'var(--ok);font-weight:600':'var(--sub)')+'">'+o.k+'. '+esc(o.v)+(d.ans.includes(o.k)?' ✓':'')+'</div>').join('');
    else lh+='<div class="ans">答案：'+esc(d.ans)+'</div>';
    lh+=knowHtml(d);
    lh+='</div>';});
  const bl=$('#blist');if(bl)bl.innerHTML=lh;
}
function doSearch(v){clearTimeout(searchTimer);searchTimer=setTimeout(function(){renderBrowse(bFilter,v);},220);}

/* ---- EXAM ---- */
function startExam(){mode='exam';stopSpeak();ttsOn=false;go('exam');
  $('#hdrBar').style.display='none';$('#hdrBarLab').style.display='none';
  renderExamSetup();}
function renderExamSetup(){
  const poolN=DATA.filter(d=>d.type!=='fill'&&d.type!=='qa').length;
  let h='<div class="back" onclick="go(\'home\')">‹ 返回首页 &nbsp;🎯 模拟考试</div>';
  h+='<div class="qcard"><div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px">选择题量</div>';
  h+='<div class="exhint">题库共有 '+poolN+' 道可考试题（判断 / 单选 / 多选），随机抽题、计时作答，交卷后自动评分并回顾错题。</div>';
  h+='<div class="chips">'+[10,20,30,50].map(n=>'<span class="chip'+(examCount===n?' on':'')+'" onclick="examCount='+n+';renderExamSetup()">'+n+' 题</span>').join('')+'</div>';
  h+='<button class="btn gold" style="width:100%;margin-top:14px" onclick="beginExam()">开始考试 ▶</button></div>';
  $('#quizHost').innerHTML=h;window.scrollTo(0,0);}
function beginExam(){
  const pool=shuffle(DATA.filter(d=>d.type!=='fill'&&d.type!=='qa').slice());
  list=pool.slice(0,Math.min(examCount,pool.length));idx=0;picked=new Set();revealed=false;
  examAns={};examStart=Date.now();
  $('#hdrBar').style.display='block';$('#hdrBarLab').style.display='flex';renderExam();}
function renderExam(){
  const d=list[idx];
  $('#barFill').style.width=((idx+1)/list.length*100)+'%';
  $('#barProg').textContent=(idx+1)+'/'+list.length;
  const el=Math.floor((Date.now()-examStart)/1000);
  $('#barScore').textContent='⏱ '+String(Math.floor(el/60)).padStart(2,'0')+':'+String(el%60).padStart(2,'0');
  let h='<div class="back" onclick="if(confirm(\'退出本次模考？\'))go(\'home\')">‹ 退出模考 &nbsp;🎯 模拟考试</div>';
  h+='<div class="qcard"><span class="qno">第 '+(idx+1)+' / '+list.length+'</span><span class="qtag '+d.type+'">'+TYPENAME[d.type]+'</span>';
  h+='<div class="qstem">'+esc(d.stem)+'</div>';
  d.opts.forEach(o=>{let cls='opt';const cur=examAns[d.id]||'';
    if(d.type==='multi'){if(cur.includes(o.k))cls+=' sel';}else{if(cur===o.k)cls+=' sel';}
    h+='<div class="'+cls+'" onclick="pickExam(\''+o.k+'\')"><span class="k">'+o.k+'</span><span class="v">'+esc(o.v)+'</span></div>';});
  h+='</div>';
  h+='<div class="navbtns"><button class="btn ghost" onclick="examPrev()" '+(idx===0?'disabled':'')+'>上一题</button>'+
     (idx<list.length-1?'<button class="btn primary" onclick="examNext()">下一题 ›</button>':'<button class="btn gold" onclick="examSubmit()">交卷评分 ✓</button>')+'</div>';
  $('#quizHost').innerHTML=h;window.scrollTo(0,0);}
function pickExam(k){const d=list[idx];let cur=examAns[d.id]||'';
  if(d.type==='multi'){let s=new Set(cur?[...cur]:[]);if(s.has(k))s.delete(k);else s.add(k);examAns[d.id]=[...s].sort().join('');}
  else examAns[d.id]=k;renderExam();}
function examPrev(){if(idx>0){idx--;renderExam();}}
function examNext(){if(idx<list.length-1){idx++;renderExam();}}
function examSubmit(){
  const unanswered=list.filter(d=>!(examAns[d.id]||'').length).length;
  if(unanswered&&!confirm('还有 '+unanswered+' 题未作答，确定交卷？'))return;
  const isOk=d=>(examAns[d.id]||'').split('').sort().join('')===d.ans.split('').sort().join('');
  let right=0;const by={};
  list.forEach(d=>{const ok=isOk(d);if(ok)right++;
    if(!by[d.type])by[d.type]=[0,0];by[d.type][1]++;if(ok)by[d.type][0]++;
    S.done[d.id]=1;if(ok)delete S.wrong[d.id];else S.wrong[d.id]=1;});
  save();if(typeof sbRecordExam==='function')sbRecordExam(right,list.length,Math.floor((Date.now()-examStart)/1000),list.filter(function(d){return !isOk(d);}).map(function(d){return d.id;}));const score=Math.round(right/list.length*100);const el=Math.floor((Date.now()-examStart)/1000);
  $('#barFill').style.width='100%';$('#barProg').textContent='已完成';$('#barScore').textContent='⏱ '+Math.floor(el/60)+'分'+el%60+'秒';
  const wrongs=list.filter(d=>!isOk(d));
  let h='<div class="qcard"><div class="res"><div style="font-size:14px;color:var(--sub)">模考成绩</div><div class="ring">'+score+'<small>分</small></div><div style="color:var(--sub);font-size:13px">答对 '+right+' / '+list.length+' 题 · 用时 '+Math.floor(el/60)+'分'+el%60+'秒</div></div>';
  h+='<table class="tres">'+Object.keys(by).map(t=>'<tr><td>'+TYPENAME[t]+'</td><td>'+by[t][0]+' / '+by[t][1]+'</td></tr>').join('')+'</table>';
  h+='<div class="navbtns"><button class="btn ghost" onclick="go(\'home\')">返回首页</button><button class="btn primary" onclick="startExam()">再考一次</button></div></div>';
  if(wrongs.length){h+='<div style="font-size:14px;font-weight:700;color:var(--navy);margin:16px 0 8px">✗ 错题回顾</div>';
    wrongs.forEach(d=>{h+='<div class="browitem"><button class="spk" style="float:right" onclick="speakById('+d.id+')">🔊</button><span class="qtag '+d.type+'">'+TYPENAME[d.type]+'</span><div class="qstem" style="font-size:14px;margin-bottom:6px">'+esc(d.stem)+'</div><div class="ans" style="font-size:13px;color:var(--ok);font-weight:600">正确答案：'+(d.opts&&d.opts.length?d.ans.split('').join('、'):esc(d.ans))+'</div></div>';});}
  $('#quizHost').innerHTML=h;window.scrollTo(0,0);}

/* ---- LISTEN 听书 ---- */
function openListen(){mode='listen';stopSpeak();ttsOn=false;ttsList=DATA.slice();shuffle(ttsList);ttsIdx=0;go('listen');renderListen();ensureAudio(function(){_refTip();},ttsList[0]?ttsList[0].id:1);}
function renderListen(){

  _tip.textContent=audioReadyFor(d.id)?'':'🎵 真人语音加载中…（当前先用系统语音，加载完自动切换）';

  h+='<div class="player"><button class="btn gold" onclick="playCur()">▶ 播放本题</button>'+

  h+='<div class="player"><button class="btn ghost" onclick="listenPrev()">‹ 上一题</button>'+
     '<button class="btn ghost" onclick="cycleRate()">'+ttsRate.toFixed(1)+'x</button>'+
     '<button class="btn ghost" onclick="listenNext()">下一题 ›</button></div>';
  h+='</div>';
  $('#quizHost').innerHTML=h;window.scrollTo(0,0);}
function playCur(){speak(correctText(ttsList[ttsIdx]),null,ttsList[ttsIdx].id);}
function toggleAuto(){if(ttsOn){ttsOn=false;stopSpeak();renderListen();}else{ttsOn=true;renderListen();autoStep();}}
function autoStep(){if(!ttsOn)return;
  if(ttsIdx>=ttsList.length){ttsOn=false;renderListen();return;}
  renderListen();
  const d=ttsList[ttsIdx];
  speak(correctText(d),function(){setTimeout(function(){ttsIdx++;autoStep();},500);},d.id);var _nx=ttsList[ttsIdx+1];if(_nx)ensureAudio(null,_nx.id);}
function listenNext(){stopSpeak();if(ttsIdx<ttsList.length-1){ttsIdx++;renderListen();if(ttsOn)autoStep();}}
